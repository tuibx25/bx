<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trắc nghiệm – Luyện tập Online</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<!-- NHÚNG FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDX1tt6PyBUxCwU6qTe9Cn9bbbWhgLKLKU",
  authDomain: "bx-vlpt.firebaseapp.com",
  projectId: "bx-vlpt",
  storageBucket: "bx-vlpt.firebasestorage.app",
  messagingSenderId: "223423849238",
  appId: "1:223423849238:web:5407c3bc93d68654dc2637",
  measurementId: "G-S37RM7Q5C5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Hàm lấy dữ liệu
  window.getFirebaseQuestions = async function() {
    try {
        const querySnapshot = await getDocs(collection(db, "vl10_questions"));
        let questions = [];
        querySnapshot.forEach((doc) => {
            questions.push(doc.data());
        });
        return questions;
    } catch(e) {
        console.error("Lỗi lấy dữ liệu Firebase:", e);
        return null;
    }
  };

  // Hàm đăng nhập
  window.loginFirebase = async function(email, password) {
    try {
        await signInWithEmailAndPassword(auth, email, password);
        return { success: true };
    } catch (e) {
        return { success: false, message: "Sai email hoặc mật khẩu!" };
    }
  };

  // Lắng nghe trạng thái đăng nhập
  window.checkAuthState = function(callback) {
      onAuthStateChanged(auth, (user) => {
          if (user) {
              document.getElementById('authUserEmail').textContent = user.email;
              callback(true);
          } else {
              callback(false);
          }
      });
  };

  window.logoutFirebase = function() {
      signOut(auth).then(() => location.reload());
  };
</script>

<style>
/* CSS CŨ GIỮ NGUYÊN */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#000000; --bg:#FFFFFF; --soft:#F5F5F5;
  --beige:#F5F5DC; --wheat:#F5DEB3; --line:#D3D3D3;
  --brown:#8B5A2B; --brown-d:#8B4513;
  --blue:#0066CC; --blue-d:#004488;
  --fs:18px;
}
body{ background:var(--bg); color:var(--ink); font-family:"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; }
.hidden{display:none !important}

/* THÊM CSS CHO MÀN HÌNH ĐĂNG NHẬP */
#loginOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 9999; display: flex; align-items: center; justify-content: center;
}
.login-card {
    background: #fff; padding: 30px; border-radius: 12px;
    width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center;
}
.login-card h2 { color: var(--brown-d); margin-bottom: 20px; font-size: 1.4em;}
.login-card input {
    width: 100%; padding: 10px; margin-bottom: 15px;
    border: 1px solid var(--line); border-radius: 6px; font-family: inherit;
}
.login-card button {
    width: 100%; padding: 10px; background: var(--blue-d); color: white;
    border: none; border-radius: 6px; font-weight: bold; font-size: 1.05em; cursor: pointer;
}
.login-card button:hover { background: var(--blue); }
#loginError { color: red; font-size: 13px; margin-bottom: 10px; min-height: 18px; }

/* ... CÁC CSS KHÁC CỦA BẠN (HEADER, TABS, BÀI LÀM...) GIỮ NGUYÊN ... */
header{ background:#FFFFFF; border-bottom:2px solid var(--brown-d); padding:6px 14px; display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:50; font-size:13.5px; }
header h1{font-size:1.1em; font-weight:800; color:var(--brown-d); margin-right:8px; white-space:nowrap}
.stat-badge{ background:#FFFFFF; border:1.5px solid var(--line); padding:3px 8px; border-radius:6px; font-weight:700; font-size:.78em; }
header .spacer{flex:1}
button{font-family:inherit; cursor:pointer}
.btn{ background:#FFFFFF; border:1.5px solid var(--line); padding:4px 10px; border-radius:6px; font-weight:600; font-size:.82em; }
.btn-primary{ background:var(--blue-d); color:#FFFFFF; border:1.5px solid var(--blue-d); padding:5px 14px; border-radius:6px; font-weight:700; font-size:.85em; }
.btn-brown{ background:var(--brown-d); color:#FFFFFF; border:1.5px solid var(--brown-d); padding:5px 14px; border-radius:6px; font-weight:700; font-size:.85em; }
.timer{ display:flex; align-items:center; gap:4px; background:var(--soft); padding:3px 8px; border-radius:6px; border:1px solid var(--line); }
nav.tabs{ display:flex; padding:0 14px; background:var(--soft); border-bottom:1px solid var(--line); }
nav.tabs button{ background:transparent; border:none; padding:12px 20px; font-weight:700; border-bottom:3px solid transparent; }
nav.tabs button.active{color:var(--brown-d); border-bottom-color:var(--brown-d); background:#FFFFFF}
main{max-width:1150px; margin:0 auto; padding:16px 20px;}
section.tab{display:none} section.tab.active{display:block}
/* (Các CSS hiển thị câu hỏi giữ nguyên như file trước) */
</style>
</head>
<body>

<!-- POPUP ĐĂNG NHẬP -->
<div id="loginOverlay" class="hidden">
    <div class="login-card">
        <h2>🔒 Đăng Nhập Hệ Thống</h2>
        <p style="font-size: 13px; color: #555; margin-bottom: 15px;">Vui lòng đăng nhập để làm bài tập.</p>
        <div id="loginError"></div>
        <input type="email" id="loginEmail" placeholder="Email (VD: hocsinh@gmail.com)">
        <input type="password" id="loginPassword" placeholder="Mật khẩu">
        <button id="btnLogin">Đăng Nhập</button>
    </div>
</div>

<!-- NỘI DUNG APP (Bị ẩn đi khi chưa đăng nhập) -->
<div id="appContent" class="hidden">
    <header>
      <h1>⚡ LUYỆN TẬP TRẮC NGHIỆM</h1>
      <span class="badge" style="font-size: 12px; background:#eee; padding:4px 8px; border-radius:4px;" id="authUserEmail"></span>
      <button class="btn" onclick="logoutFirebase()" style="color: red;">Đăng xuất</button>
      <span class="stat-badge">Đã trả lời: <b id="answeredCount">0</b>/<span id="totalCount">0</span></span>
      <button class="btn-primary" id="btnSubmit">📝 Nộp bài</button>
      <button class="btn-brown hidden" id="btnRedo">🔄 Làm lại</button>
      <button class="btn" id="btnLoadMenu">⚙️ Chọn</button>
      <span class="spacer"></span>
      <div class="timer">
        <select id="tMin"><option value="25" selected>25′</option></select>
        <span id="tDisp">25:00</span>
        <button class="btn" id="tBtn">Bắt đầu</button>
      </div>
    </header>

    <nav class="tabs">
      <button data-tab="tab1" class="active">📄 Đề bài</button>
      <button data-tab="tab3">🎯 Kết quả</button>
    </nav>

    <main>
      <section id="tab1" class="tab active"><div id="examBody"></div></section>
      <section id="tab3" class="tab">
        <div id="resultBody"></div>
      </section>
    </main>
    
    <!-- (Các thẻ div LoadOverlay, Script bài làm giữ nguyên từ file trước) -->
    <!-- Tôi rút gọn phần này để bạn dễ nhìn, bạn copy nguyên phần thân vào nhé -->
</div>

<script>
// KHỞI TẠO VÀ KIỂM TRA ĐĂNG NHẬP
window.addEventListener('load', () => {
    // Kiểm tra xem đã đăng nhập chưa
    window.checkAuthState((isLoggedIn) => {
        if (isLoggedIn) {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            // Bắt đầu tải đề
            if(typeof autoLoadExam === 'function') {
                autoLoadExam();
            }
        } else {
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('appContent').classList.add('hidden');
        }
    });
});

// XỬ LÝ NÚT ĐĂNG NHẬP
document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    
    if(!email || !pass) { errBox.textContent = "Vui lòng nhập đủ thông tin!"; return; }
    
    errBox.textContent = "Đang kiểm tra...";
    const res = await window.loginFirebase(email, pass);
    if(!res.success) {
        errBox.textContent = res.message;
    } else {
        errBox.textContent = "";
    }
});
</script>
</body>
</html>
