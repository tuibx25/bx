<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time & Âm Lịch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .tabs {
            display: flex;
            background: linear-gradient(to right, #8B4513, #A52A2A);
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 20px 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 4px solid transparent;
        }
        
        .tab:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .tab.active {
            background-color: rgba(255, 255, 255, 0.15);
            border-bottom: 4px solid #FFD700;
            color: #FFD700;
        }
        
        .tab-content {
            display: none;
            min-height: 700px;
            width: 100%;
            border: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        #time-frame, #calendar-frame {
            width: 100%;
            height: 700px;
            border: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .tab {
                font-size: 1.2rem;
                padding: 15px 0;
            }
            
            #time-frame, #calendar-frame {
                height: 600px;
            }
        }
        
        @media (max-width: 480px) {
            .tab {
                font-size: 1rem;
                padding: 12px 0;
            }
            
            #time-frame, #calendar-frame {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active" data-tab="time">Time</div>
            <div class="tab" data-tab="calendar">Âm Lịch</div>
        </div>
        
        <div class="tab-content active" id="time-content">
            <iframe id="time-frame" src="Time.html" title="Giờ Hà Nội"></iframe>
        </div>
        
        <div class="tab-content" id="calendar-content">
            <iframe id="calendar-frame" src="AmLich.html" title="Âm Lịch"></iframe>
        </div>
    </div>
    <script>
        // Xử lý chuyển tab
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    
                    // Ẩn tất cả các tab content và xóa class active
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                    });
                    
                    // Xóa class active từ tất cả các tab
                    tabs.forEach(t => {
                        t.classList.remove('active');
                    });
                    
                    // Hiển thị tab content được chọn và thêm class active cho tab
                    document.getElementById(`${targetTab}-content`).classList.add('active');
                    this.classList.add('active');
                });
            });
            
            // Tải nội dung iframe khi tab được chọn để đảm bảo đồng hồ chạy đúng
            const timeFrame = document.getElementById('time-frame');
            const calendarFrame = document.getElementById('calendar-frame');
            
            // Đảm bảo iframe đã được tải
            timeFrame.onload = function() {
                console.log("Time iframe loaded");
            };
            
            calendarFrame.onload = function() {
                console.log("Calendar iframe loaded");
            };
        });
    </script>
</body>
</html>
