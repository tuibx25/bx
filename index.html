<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time & Âm Lịch</title>
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/tuibx25/images/bx/favicon.ico">
    
    <!-- BẢO MẬT -->
    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.keyCode === 85) e.preventDefault();
            if (e.ctrlKey && e.keyCode === 83) e.preventDefault();
            if (e.ctrlKey && e.keyCode === 80) e.preventDefault();
            if (e.keyCode === 123) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) e.preventDefault();
        });
        document.addEventListener('dragstart', function(e) { if (e.target.tagName === 'IMG') e.preventDefault(); });
        document.addEventListener('copy', function(e) { e.preventDefault(); alert('Không cho phép sao chép nội dung!'); });
        document.addEventListener('cut', function(e) { e.preventDefault(); });
        document.addEventListener('paste', function(e) { e.preventDefault(); });
        document.addEventListener('selectstart', function(e) { e.preventDefault(); });
        document.addEventListener('mousedown', function(e) { if (e.detail > 1) e.preventDefault(); });
    </script>
    
    <!-- CHỐNG IN ẤN -->
    <style>
        @media print {
            * { display: none !important; }
            body:before { 
                content: "Không cho phép in trang này!"; 
                display: block !important; 
                font-size: 24px; 
                text-align: center; 
                margin-top: 100px; 
            }
        }
    </style>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        /* WATERMARK NỀN */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdn.jsdelivr.net/gh/tuibx25/images/bx/tuibx.png');
            background-repeat: repeat;
            background-position: center;
            background-size: 400px 400px;
            opacity: 0.05;
            z-index: -1;
            pointer-events: none;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .tabs {
            display: flex;
            background: linear-gradient(to right, #8B4513, #A52A2A);
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 20px 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 4px solid transparent;
        }
        
        .tab:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .tab.active {
            background-color: rgba(255, 255, 255, 0.15);
            border-bottom: 4px solid #FFD700;
            color: #FFD700;
        }
        
        .tab-content {
            display: none;
            min-height: 700px;
            width: 100%;
            border: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        #time-frame, #calendar-frame {
            width: 100%;
            height: 700px;
            border: none;
        }
        
        /* WATERMARK PHỦ TOÀN MÀN HÌNH */
        .watermark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }
        
        .watermark-overlay::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdn.jsdelivr.net/gh/tuibx25/images/bx/tuibx.png');
            background-repeat: repeat;
            background-position: center;
            background-size: 200px 200px;
            opacity: 0.03;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        
        .footer::before {
            content: "tuibx";
            position: absolute;
            bottom: 2px;
            right: 6px;
            font-size: 1rem;
            color: rgba(139, 69, 19, 0.3);
            font-weight: bold;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .tab {
                font-size: 1.2rem;
                padding: 15px 0;
            }
            
            #time-frame, #calendar-frame {
                height: 600px;
            }
        }
        
        @media (max-width: 480px) {
            .tab {
                font-size: 1rem;
                padding: 12px 0;
            }
            
            #time-frame, #calendar-frame {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <!-- WATERMARK PHỦ TOÀN MÀN HÌNH -->
    <div class="watermark-overlay"></div>
    
    <div class="container">
        <div class="tabs">
            <div class="tab active" data-tab="time">Time</div>
            <div class="tab" data-tab="calendar">Âm Lịch</div>
        </div>
        
        <div class="tab-content active" id="time-content">
            <iframe id="time-frame" src="Time.html" title="Giờ Hà Nội"></iframe>
        </div>
        
        <div class="tab-content" id="calendar-content">
            <iframe id="calendar-frame" src="AmLich.html" title="Âm Lịch"></iframe>
        </div>
    </div>
    <script>
        // Xử lý chuyển tab
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    
                    // Ẩn tất cả các tab content và xóa class active
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                    });
                    
                    // Xóa class active từ tất cả các tab
                    tabs.forEach(t => {
                        t.classList.remove('active');
                    });
                    
                    // Hiển thị tab content được chọn và thêm class active cho tab
                    document.getElementById(`${targetTab}-content`).classList.add('active');
                    this.classList.add('active');
                });
            });
            
            // Tải nội dung iframe khi tab được chọn để đảm bảo đồng hồ chạy đúng
            const timeFrame = document.getElementById('time-frame');
            const calendarFrame = document.getElementById('calendar-frame');
            
            // Đảm bảo iframe đã được tải
            timeFrame.onload = function() {
                console.log("Time iframe loaded");
            };
            
            calendarFrame.onload = function() {
                console.log("Calendar iframe loaded");
            };
        });
    </script>
</body>
</html>
