<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản Trị Hệ Thống Thi - Giáo Viên</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="/bx/firebase-init.js"></script>

<style>
    :root { 
        --ink: #000000; --bg: #F5F5F5; --white: #FFFFFF;
        --border: #D3D3D3; --primary: #004488; --primary-light: #0066CC;
        --brown: #8B5A2B; --brown-d: #8B4513;
        --beige: #F5F5DC; --wheat: #F5DEB3;
    }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--ink); }
    .container { max-width: 1400px; margin: 0 auto; background: var(--white); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    h2 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0; }
    
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tab-btn { padding: 12px 24px; cursor: pointer; border: none; background: none; font-size: 15px; font-weight: bold; color: var(--ink); transition: 0.2s; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: var(--bg); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--ink); }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; font-size: 14px; color: var(--ink); background: var(--white);}
    .form-control:focus { outline: none; border-color: var(--primary-light); }
    .row { display: flex; gap: 15px; flex-wrap: wrap; }
    .row > .form-group { flex: 1; min-width: 200px; }
    .checkbox-group { display: flex; gap: 20px; margin-top: 10px; }
    .checkbox-group label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--ink); }
    
    .btn { background: var(--primary); color: var(--white); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .btn:hover:not(:disabled) { background: var(--primary-light); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-success { background: var(--primary); color: var(--white); }
    .btn-success:hover:not(:disabled) { background: var(--primary-light); }
    .btn-danger { background: var(--brown-d); color: var(--white); }
    .btn-danger:hover:not(:disabled) { background: var(--brown); }
    .btn-warning { background: var(--wheat); color: var(--brown-d); border: 1px solid var(--brown);}
    .btn-warning:hover:not(:disabled) { background: var(--beige); }
    .btn-outline { background: var(--white); border: 1px solid var(--primary); color: var(--primary); }
    .btn-outline:hover:not(:disabled) { background: var(--bg); }

    .table-wrap { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; background: var(--white); }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 14px; color: var(--ink); }
    th { background: var(--beige); color: var(--primary); font-weight: bold; position: sticky; top: 0; text-align: center; word-break: break-word; min-width: 120px;}
    
    .sub-row { background: var(--bg); font-size: 13px; }
    .sub-row td { border-top: none; }

    .stt-col { width: 50px; text-align: center; font-weight: bold; }
    .score-input { width: 70px; padding: 5px; border: 1px solid var(--primary); border-radius: 4px; font-weight: bold; text-align: center; color: var(--ink); }
    
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap; border: 1px solid transparent;}
    .status-pending { background: var(--wheat); color: var(--brown-d); border-color: var(--brown); }
    .status-published { background: var(--primary); color: var(--white); }
    .status-hidden { background: var(--border); color: var(--ink); }
    
    .search-bar { display: flex; gap: 10px; margin-bottom: 5px; align-items: center; background: var(--white); padding: 10px; border: 1px solid var(--border); border-radius: 5px;}
    .search-bar input { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 4px; color: var(--ink); }
    .search-bar input:focus { outline: none; border-color: var(--primary-light); }

    .batch-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 15px; }
    .batch-label { font-size: 13px; color: #666; }
    .btn-batch { font-size: 12px; padding: 4px 10px; border-radius: 4px; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; overflow-y: auto; padding: 20px;}
    .modal-content { background: var(--white); max-width: 800px; margin: 40px auto; padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
    .modal-close { cursor: pointer; font-size: 24px; font-weight: bold; color: var(--brown-d); }
    .modal-close:hover { color: var(--brown); }
    
    .q-detail { border: 1px solid var(--border); padding: 10px; margin-bottom: 10px; border-radius: 5px; background: var(--bg);}
    .ans-correct { color: var(--primary); font-weight: bold; }
    .ans-wrong { color: var(--brown-d); font-weight: bold; text-decoration: line-through; }
    .ans-neutral { color: var(--ink); }

    .hidden { display: none !important; }

    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 5px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingScreen" style="text-align: center; margin-top: 50px;">
    <h2>🔄 Đang xác thực quyền Giáo viên...</h2>
</div>

<div id="mainContent" class="container hidden">
    <h2>👨‍🏫 TRANG QUẢN TRỊ GIÁO VIÊN</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tabManageAssign', this)">📝 Quản lý Giao Đề</button>
        <button class="tab-btn" onclick="switchTab('tabGrade', this)">🎯 Chấm Điểm & Chi Tiết</button>
        <button class="tab-btn" onclick="switchTab('tabGradebook', this)">📊 Sổ Điểm Lớp</button>
        <button class="tab-btn" onclick="switchTab('tabManageStudents', this)">👥 Quản lý Học Sinh</button>
    </div>

    <div id="tabManageAssign" class="tab-content active">
        <div style="background: var(--bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border);">
            <h3 style="margin-top: 0; color: var(--primary);">Tạo Đợt Giao Bài Mới</h3>
            <div class="row">
                <div class="form-group">
                    <label>Chọn Đề Thi:</label>
                    <select id="selectExam" class="form-control"><option value="">-- Tải danh sách --</option></select>
                </div>
                <div class="form-group">
                    <label>Tên hiển thị:</label>
                    <input type="text" id="inputTitle" class="form-control" placeholder="VD: Kiểm tra 15p Lý 10">
                </div>
                <div class="form-group">
                    <label>Lớp được làm:</label>
                    <input type="text" id="inputClasses" class="form-control" placeholder="VD: 10a11, 10a12">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Thời gian (Phút):</label>
                    <input type="number" id="inputDuration" class="form-control" value="15" min="1">
                </div>
                <div class="form-group">
                    <label>Số lần làm tối đa:</label>
                    <input type="number" id="inputMaxAttempts" class="form-control" value="1" min="1">
                </div>
                <div class="form-group">
                    <div class="checkbox-group" style="margin-top: 25px;">
                        <label><input type="checkbox" id="chkShuffleQ" checked> Đảo câu hỏi</label>
                        <label><input type="checkbox" id="chkShuffleO" checked> Đảo đáp án</label>
                    </div>
                </div>
            </div>
            <button class="btn btn-success" id="btnAssignExam" onclick="assignExam()" style="width: 100%; padding: 12px; font-size: 16px;">🚀 GIAO BÀI</button>
        </div>

        <h3 style="color: var(--primary);">Danh Sách Các Đợt Giao Bài</h3>
        <div class="search-bar">
            <input type="text" id="searchAssign" placeholder="🔍 Tìm kiếm theo tên bài hoặc lớp..." oninput="renderAssignments()">
        </div>
        <div class="table-wrap" id="assignmentList"></div>
    </div>

    <div id="tabGrade" class="tab-content">
        <div class="form-group">
            <label>Chọn Đợt Thi Để Chấm:</label>
            <select id="selectAssignment" class="form-control" onchange="loadSubmissions()">
                <option value="">-- Chọn đợt giao bài (Chỉ hiện đề Đang Mở) --</option>
            </select>
        </div>

        <div id="gradeResult">
            <p style="text-align: center; color: var(--ink);">Vui lòng chọn một đợt thi để xem bài nộp.</p>
        </div>
    </div>

    <div id="tabGradebook" class="tab-content">
        <div class="row" style="align-items: flex-end;">
            <div class="form-group" style="max-width: 300px;">
                <label>Chọn Lớp:</label>
                <input type="text" id="inputClassGradebook" class="form-control" placeholder="VD: 10a11" oninput="loadGradebook()">
            </div>
            <div class="form-group">
                <button class="btn btn-outline" onclick="exportExcel()">📥 Xuất File Excel</button>
            </div>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchStudent" placeholder="🔍 Tìm tên học sinh..." oninput="filterGradebook()">
        </div>
        <div class="table-wrap" id="gradebookResult">
            <p style="text-align: center; color: var(--ink);">Vui lòng nhập tên lớp để tải sổ điểm.</p>
        </div>
    </div>

    <div id="tabManageStudents" class="tab-content">
        <div style="background: var(--bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border);">
            <h3 style="margin-top: 0; color: var(--primary);">Nạp Sổ Điểm Lớp (File Excel/CSV)</h3>
            <div class="row">
                <div class="form-group" style="max-width: 300px;">
                    <label>Tên Lớp:</label>
                    <input type="text" id="uploadClassId" class="form-control" placeholder="VD: 10a11">
                </div>
                <div class="form-group">
                    <label>Chọn File:</label>
                    <input type="file" id="uploadRosterFile" class="form-control" accept=".xlsx, .xls, .csv">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" id="btnUploadRoster" onclick="uploadRoster()">📤 Tải Lên Sổ Điểm</button>
                </div>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="inputClassStudentTab" placeholder="Lọc theo lớp (VD: 10a11)" style="max-width: 200px;" oninput="onClassFilterChange()">
            <input type="text" id="searchStudentTab" placeholder="🔍 Tìm tên hoặc email..." oninput="renderStudentTable()">
            <button class="btn btn-primary" id="btnReloadUsers" onclick="loadAllUsersAndRender()">Tải lại danh sách</button>
        </div>

        <div class="batch-actions">
            <span class="batch-label"><b id="batchClassLabel">...</b>:</span>
            <button class="btn btn-warning btn-batch" id="btnLockClass" onclick="toggleClassProfileLock(true)" disabled>🔒 Khóa sửa Hồ Sơ</button>
            <button class="btn btn-success btn-batch" id="btnUnlockClass" onclick="toggleClassProfileLock(false)" disabled>🔓 Mở khóa sửa Hồ Sơ</button>
        </div>

        <div class="table-wrap" id="studentListTable">
            <p style="text-align: center; color: var(--ink);">Bấm "Tải lại danh sách" để xem học sinh.</p>
        </div>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin: 0; color: var(--primary);">Chi tiết bài làm</h3>
            <span class="modal-close" onclick="closeModal()">×</span>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    let currentUser = null;
    let allExams = {};
    let allAssignments = {};
    let allUsersList = [];
    let currentRoster = [];
    let allGradebookData = [];

    function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#39;';
            return m;
        });
    }

    window.addEventListener('load', () => {
        window.checkAuthState((isLoggedIn) => {
            if (!isLoggedIn) return;
            import('/bx/firebase-init.js').then(({ auth }) => {
                currentUser = auth.currentUser;
                if (currentUser.email !== 'trntui6@gmail.com') {
                    document.getElementById('loadingScreen').innerHTML = "<h2 style='color:var(--brown-d);'>⛔ BẠN KHÔNG PHẢI LÀ GIÁO VIÊN!</h2>";
                    return;
                }
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                loadExamsForDropdown();
                loadAssignmentsData();
            });
        });
    });

    window.switchTab = function(tabId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        if (btn) btn.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function normalizeName(str) {
        if (!str) return "";
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function setBtnLoading(btnId, isLoading, originalText) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        if (isLoading) {
            btn.disabled = true;
            btn.dataset.original = originalText || btn.innerHTML;
            btn.innerHTML = `<span class="spinner"></span> Đang xử lý...`;
        } else {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.original || originalText || btn.innerHTML;
        }
    }

    // ==========================================
    // TAB 1: QUẢN LÝ GIAO ĐỀ
    // ==========================================
    async function loadExamsForDropdown() {
        const { db } = await import('/bx/firebase-init.js');
        const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        const snap = await getDocs(collection(db, "exams"));
        const select = document.getElementById('selectExam');
        select.innerHTML = '<option value="">-- Chọn đề thi --</option>';
        allExams = {};
        
        snap.forEach(doc => {
            const data = doc.data();
            allExams[doc.id] = data;
            if (data.isHidden !== true) {
                select.innerHTML += `<option value="${doc.id}">${escapeHTML(data.title)} (Khối ${escapeHTML(data.grade)})</option>`;
            }
        });
    }

    window.assignExam = async function() {
        const examId = document.getElementById('selectExam').value;
        const title = document.getElementById('inputTitle').value.trim();
        const classesRaw = document.getElementById('inputClasses').value.trim();
        const duration = parseInt(document.getElementById('inputDuration').value);
        const maxAttempts = parseInt(document.getElementById('inputMaxAttempts').value);
        const shuffleQ = document.getElementById('chkShuffleQ').checked;
        const shuffleO = document.getElementById('chkShuffleO').checked;

        if (!examId || !title || !classesRaw) return alert("Vui lòng nhập đủ thông tin!");
        if (duration < 1 || maxAttempts < 1) return alert("Thời gian và số lượt phải lớn hơn 0!");
        
        const assignedClasses = classesRaw.split(',').map(c => c.trim().toLowerCase()).filter(c => c);

        setBtnLoading('btnAssignExam', true);
        try {
            const { db } = await import('/bx/firebase-init.js');
            const { collection, addDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
            await addDoc(collection(db, "exam_assignments"), {
                examId, title, assignedClasses, duration, maxAttempts,
                shuffleQuestions: shuffleQ, shuffleOptions: shuffleO,
                isOpen: true, createdAt: serverTimestamp()
            });

            alert("✅ Đã giao bài thành công!");
            document.getElementById('inputTitle').value = "";
            document.getElementById('inputClasses').value = "";
            loadAssignmentsData();
        } catch (e) {
            alert("Lỗi giao bài: " + e.message);
        } finally {
            setBtnLoading('btnAssignExam', false, '🚀 GIAO BÀI');
        }
    }

    async function loadAssignmentsData() {
        const { db } = await import('/bx/firebase-init.js');
        const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        const snap = await getDocs(collection(db, "exam_assignments"));
        allAssignments = {};
        const select = document.getElementById('selectAssignment');
        select.innerHTML = '<option value="">-- Chọn đợt giao bài (Chỉ hiện đề Đang Mở) --</option>';
        
        snap.forEach(doc => {
            const data = doc.data();
            allAssignments[doc.id] = data;
            if (data.isOpen) {
                select.innerHTML += `<option value="${doc.id}">${escapeHTML(data.title)} (Lớp: ${escapeHTML(data.assignedClasses.join(', '))})</option>`;
            }
        });
        renderAssignments();
    }

    window.renderAssignments = function() {
        const keyword = document.getElementById('searchAssign').value.toLowerCase();
        const tbody = document.getElementById('assignmentList');
        let html = `<table><thead><tr><th class="stt-col">STT</th><th>Tên Bài</th><th>Lớp</th><th>Thời gian</th><th>Lượt</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>`;
        let stt = 1;
        for (const id in allAssignments) {
            const a = allAssignments[id];
            if (!a.title.toLowerCase().includes(keyword) && !a.assignedClasses.join(',').toLowerCase().includes(keyword)) continue;
            const status = a.isOpen ? '<span class="status-badge status-published">Đang mở</span>' : '<span class="status-badge status-pending">Đã ẩn</span>';
            html += `<tr>
                <td class="stt-col">${stt++}</td><td><b>${escapeHTML(a.title)}</b></td><td>${escapeHTML(a.assignedClasses.join(', '))}</td><td>${a.duration} phút</td><td>${a.maxAttempts} lần</td><td>${status}</td>
                <td>
                    <button class="btn btn-sm ${a.isOpen ? 'btn-warning' : 'btn-success'}" onclick="toggleAssign('${id}', ${a.isOpen})">${a.isOpen ? 'Ẩn' : 'Hiện'}</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteAssign('${id}')">Xóa</button>
                </td>
            </tr>`;
        }
        tbody.innerHTML = html + `</tbody></table>`;
    }

    window.toggleAssign = async function(id, currentStatus) {
        const { db } = await import('/bx/firebase-init.js');
        const { doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        
        await updateDoc(doc(db, "exam_assignments", id), { isOpen: !currentStatus });
        
        const assignment = allAssignments[id];
        if (assignment && assignment.examId) {
            await updateDoc(doc(db, "exams", assignment.examId), { isHidden: currentStatus });
        }
        
        loadAssignmentsData();
        loadExamsForDropdown(); 
    }

    window.deleteAssign = async function(id) {
        if(!confirm("Bạn có chắc muốn xóa đợt giao bài này?\n\nLưu ý: Dữ liệu bài nộp của học sinh vẫn sẽ còn trong hệ thống nhưng không thể truy cập qua giao diện này nữa.")) return;
        const { db } = await import('/bx/firebase-init.js');
        const { doc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        await deleteDoc(doc(db, "exam_assignments", id));
        loadAssignmentsData();
    }

    // ==========================================
    // TAB 2: CHẤM ĐIỂM & CHI TIẾT
    // ==========================================
    window.loadSubmissions = async function() {
        const assignmentId = document.getElementById('selectAssignment').value;
        const resultDiv = document.getElementById('gradeResult');
        if (!assignmentId) return resultDiv.innerHTML = "<p>Vui lòng chọn đợt thi.</p>";
        
        resultDiv.innerHTML = "<p>⏳ Đang tải dữ liệu lớp và bài nộp...</p>";
        const { db } = await import('/bx/firebase-init.js');
        const { collection, getDocs, query, where, doc, getDoc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        
        try {
            const assignment = allAssignments[assignmentId];
            if (!assignment) throw new Error("Không tìm thấy thông tin đợt giao bài.");

            const assignedClasses = assignment.assignedClasses || [];
            if (assignedClasses.length === 0) throw new Error("Đợt giao bài này không có lớp nào.");

            const keySnap = await getDoc(doc(db, "exam_keys", assignment.examId));
            if (!keySnap.exists()) throw new Error("Không tìm thấy đáp án của đề thi này. Vui lòng kiểm tra lại!");
            const answerKey = keySnap.data().answers;

            let allRosters = {};
            let allUsersInClasses = [];
            const classQueries = assignedClasses.map(c => getDoc(doc(db, "exam_rosters", c)));
            const userQueries = assignedClasses.map(c => getDocs(query(collection(db, "users"), where("class", "==", c))));

            const [rosterSnaps, userSnaps, subSnap] = await Promise.all([
                Promise.all(classQueries),
                Promise.all(userQueries),
                getDocs(query(collection(db, "exam_submissions"), where("assignmentId", "==", assignmentId)))
            ]);

            rosterSnaps.forEach((snap, idx) => {
                const cls = assignedClasses[idx];
                allRosters[cls] = snap.exists() ? snap.data().students : [];
            });

            userSnaps.forEach((snap) => {
                snap.forEach(d => allUsersInClasses.push({ id: d.id, ...d.data() }));
            });

            let submissions = subSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            const combinedStudents = [];
            assignedClasses.forEach(cls => {
                (allRosters[cls] || []).forEach(st => {
                    combinedStudents.push({ ...st, classOfStudent: cls });
                });
            });

            if (combinedStudents.length === 0) {
                return resultDiv.innerHTML = `<p style="color: var(--brown-d);">Các lớp [${escapeHTML(assignedClasses.join(', '))}] chưa nạp sổ điểm! Không thể chấm.</p>`;
            }

            let html = `<table><thead><tr><th class="stt-col">STT</th><th>Họ Tên</th><th>Lớp</th><th>Lần làm</th><th>Trạng thái</th><th>Điểm tự động</th><th>Điểm chốt</th><th>Hành động</th></tr></thead><tbody>`;

            const renderRow = (sub, attemptIdx, isHidden, isMain, st, user, index) => {
                let status = '';
                let canPublish = false;

                if (sub.status === 'in_progress' && Date.now() > sub.endTime) {
                    sub.status = 'submitted';
                    updateDoc(doc(db, "exam_submissions", sub.id), { status: 'submitted' }).catch(e => console.warn(e));
                }

                if (sub.status === 'in_progress') {
                    status = '<span class="status-badge status-pending">Đang làm bài (Chưa nộp)</span>';
                } else if (sub.status === 'submitted' && !sub.isPublished) {
                    status = '<span class="status-badge status-pending">Chờ duyệt</span>';
                    canPublish = true;
                } else if (sub.isPublished) {
                    status = '<span class="status-badge status-published">Đã công bố</span>';
                }

                const autoScore = calculateScore(sub.answers || {}, answerKey);
                const displayScore = (sub.score != null) ? sub.score : autoScore;
                const rowClass = isHidden ? `sub-row hidden hidden-sub-${user.id}` : '';
                
                let actionHtml = `<button class="btn btn-sm btn-outline" onclick="viewDetail('${sub.id}', '${assignmentId}')">Chi tiết</button>`;
                if (canPublish) actionHtml += ` <button class="btn btn-sm btn-success" onclick="publishScore('${sub.id}')">Công bố</button>`;
                
                if (isMain) {
                    const userAllSubs = submissions.filter(s => s.studentId === user.id && s.assignmentId === assignmentId);
                    if (userAllSubs.length > 1) {
                        actionHtml += ` <button class="btn btn-sm btn-outline" onclick="toggleExpand('${user.id}', this)">▼ Mở rộng</button>`;
                    }
                }

                const scoreDisplay = (sub.status === 'in_progress') ? '-' : Number(displayScore).toFixed(2);

                return `
                    <tr class="${rowClass}">
                        <td class="stt-col">${isMain ? index + 1 : ''}</td>
                        <td>${isMain ? `<b>${escapeHTML(st.name)}</b><br><small>${escapeHTML(user.email)}</small>` : '<i style="color:#888;">(Lần khác)</i>'}</td>
                        <td style="text-align:center; font-size:12px;">${escapeHTML(st.classOfStudent || '')}</td>
                        <td>Lần ${attemptIdx + 1} ${isMain && sub.isPublished ? '<b style="color: var(--primary);">(Cao nhất)</b>' : ''}</td>
                        <td>${status}</td>
                        <td style="color: var(--primary); font-weight: bold;">${scoreDisplay}</td>
                        <td><input type="number" step="0.05" class="score-input" id="score-${sub.id}" value="${sub.status === 'in_progress' ? '0.00' : Number(displayScore).toFixed(2)}" ${sub.isPublished || sub.status === 'in_progress' ? 'disabled' : ''}></td>
                        <td>${actionHtml}</td>
                    </tr>
                `;
            };

            combinedStudents.forEach((st, index) => {
                const normName = normalizeName(st.name);
                const user = allUsersInClasses.find(u => 
                    normalizeName(u.name) === normName && u.class === st.classOfStudent
                );
                
                if (!user) {
                    html += `<tr style="opacity: 0.6;">
                        <td class="stt-col">${index + 1}</td>
                        <td><b>${escapeHTML(st.name)}</b><br><small>(Chưa ĐK tài khoản)</small></td>
                        <td style="text-align:center; font-size:12px;">${escapeHTML(st.classOfStudent || '')}</td>
                        <td colspan="5" style="text-align: center; color: #888;">Không có dữ liệu</td>
                    </tr>`;
                } else {
                    const userSubs = submissions.filter(s => s.studentId === user.id);
                    userSubs.sort((a, b) => (a.startTime || 0) - (b.startTime || 0));

                    if (userSubs.length === 0) {
                        html += `<tr style="background: var(--wheat);">
                            <td class="stt-col">${index + 1}</td>
                            <td><b>${escapeHTML(st.name)}</b><br><small>${escapeHTML(user.email)}</small></td>
                            <td style="text-align:center; font-size:12px;">${escapeHTML(st.classOfStudent || '')}</td>
                            <td>0</td>
                            <td style="color: var(--brown-d); font-weight: bold;">Chưa làm bài</td>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                        </tr>`;
                    } else {
                        let completedSubs = userSubs.filter(s => s.status === 'submitted' || s.isPublished);
                        let bestSub = null;
                        if (completedSubs.length > 0) {
                            let published = completedSubs.filter(s => s.isPublished);
                            if(published.length > 0) bestSub = published.reduce((p, c) => (p.score > c.score) ? p : c);
                            else bestSub = completedSubs[completedSubs.length - 1];
                        } else {
                            bestSub = userSubs[userSubs.length - 1];
                        }

                        html += renderRow(bestSub, userSubs.indexOf(bestSub), false, true, st, user, index);

                        userSubs.forEach((sub, idx) => {
                            if (sub.id !== bestSub.id) {
                                html += renderRow(sub, idx, true, false, st, user, index);
                            }
                        });
                    }
                }
            });

            resultDiv.innerHTML = html + `</tbody></table>`;
        } catch (err) {
            console.error("Lỗi tải bài nộp:", err);
            resultDiv.innerHTML = `<p style="color: var(--brown-d); font-weight: bold;">❌ Lỗi: ${escapeHTML(err.message)}</p>`;
        }
    }

    function calculateScore(answers, answerKey) {
        if (!answers || !answerKey) return 0;
        let score = 0;
        for (const uid in answerKey) {
            const correct = answerKey[uid];
            const studentAns = answers[uid];
            if (studentAns === undefined || studentAns === null || studentAns === "") continue;
            if (typeof correct === 'number' && !Array.isArray(correct)) {
                if (uid.startsWith('p3')) { if (parseFloat(studentAns) === correct) score += 0.5; } 
                else { if (parseInt(studentAns) === correct) score += 0.25; }
            } else if (Array.isArray(correct)) {
                let count = 0;
                for (let i = 0; i < 4; i++) if (studentAns[i] === correct[i]) count++;
                if (count === 4) score += 1.0; 
                else if (count === 3) score += 0.5;
                else if (count === 2) score += 0.25; 
                else if (count === 1) score += 0.1;
            }
        }
        return score;
    }

    window.viewDetail = async function(subId, assignmentId) {
        document.getElementById('detailModal').style.display = 'block';
        document.getElementById('modalBody').innerHTML = "<p>⏳ Đang tải chi tiết...</p>";
        
        try {
            const { db } = await import('/bx/firebase-init.js');
            const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
            
            const assignment = allAssignments[assignmentId];
            if (!assignment) throw new Error("Không tìm thấy đợt giao bài.");

            const [examSnap, keySnap, subSnap] = await Promise.all([
                getDoc(doc(db, "exams", assignment.examId)),
                getDoc(doc(db, "exam_keys", assignment.examId)),
                getDoc(doc(db, "exam_submissions", subId))
            ]);

            if (!examSnap.exists()) throw new Error("Không tìm thấy đề thi.");
            if (!keySnap.exists()) throw new Error("Không tìm thấy đáp án đề thi.");
            if (!subSnap.exists()) throw new Error("Không tìm thấy bài nộp.");

            const examData = examSnap.data();
            const answerKey = keySnap.data().answers;
            const subData = subSnap.data();
            const studentAnswers = subData.answers || {};
            
            let html = `<p><b>Học sinh:</b> ${escapeHTML(subData.studentEmail)}</p>`;
            if (subData.status === 'in_progress') {
                html += `<p style="color: var(--brown-d); font-weight: bold;">(Học sinh chưa nộp bài. Dưới đây là các đáp án đã lưu tạm)</p>`;
            }

            examData.questions.forEach((q, idx) => {
                const correctAns = answerKey[q.uid];
                const studentAns = studentAnswers[q.uid];
                html += `<div class="q-detail"><p><b>Câu ${idx + 1}:</b> ${escapeHTML(q.text)}</p>`;
                if (q.part === 1) {
                    q.options.forEach((opt, oIdx) => {
                        const isShuffled = typeof opt === 'object';
                        const origIdx = isShuffled ? opt.originalIndex : oIdx;
                        const text = isShuffled ? opt.text : opt;
                        let cls = "ans-neutral";
                        let marker = "";
                        if (origIdx === correctAns) { cls = "ans-correct"; marker = " ✅ (Đáp án đúng)"; }
                        if (origIdx === studentAns) {
                            if (origIdx === correctAns) marker = " ✅ (Đã chọn - Đúng)";
                            else { cls = "ans-wrong"; marker = " ❌ (Đã chọn - Sai)"; }
                        }
                        html += `<div class="${cls}">${String.fromCharCode(65 + oIdx)}. ${escapeHTML(text)}${marker}</div>`;
                    });
                } else if (q.part === 2) {
                    q.statements.forEach((st, sIdx) => {
                        const stAns = studentAns ? studentAns[sIdx] : "";
                        const isCorrect = stAns === correctAns[sIdx];
                        html += `<div class="${isCorrect ? 'ans-correct' : 'ans-wrong'}">${String.fromCharCode(97 + sIdx)}) ${escapeHTML(st)} - HS chọn: ${escapeHTML(stAns || 'Trống')} (Đáp án: ${escapeHTML(correctAns[sIdx])})</div>`;
                    });
                } else if (q.part === 3) {
                    const isCorrect = parseFloat(studentAns) === correctAns;
                    html += `<div class="${isCorrect ? 'ans-correct' : 'ans-wrong'}">HS trả lời: ${escapeHTML(studentAns || 'Trống')} (Đáp án: ${escapeHTML(correctAns)})</div>`;
                }
                html += `</div>`;
            });
            document.getElementById('modalBody').innerHTML = html;
        } catch (err) {
            console.error("Lỗi tải chi tiết:", err);
            document.getElementById('modalBody').innerHTML = `<p style="color: var(--brown-d); font-weight: bold;">❌ Lỗi: ${escapeHTML(err.message)}</p>`;
        }
    }

    window.loadGradebook = async function() {
        const className = document.getElementById('inputClassGradebook').value.trim().toLowerCase();
        if (!className) return;
        
        const resultDiv = document.getElementById('gradebookResult');
        resultDiv.innerHTML = "<p>⏳ Đang tải sổ điểm...</p>";

        try {
            const { db } = await import('/bx/firebase-init.js');
            const { collection, getDocs, query, where, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

            const rosterSnap = await getDoc(doc(db, "exam_rosters", className));
            if (!rosterSnap.exists()) {
                resultDiv.innerHTML = `<p style="color: var(--brown-d); text-align: center;">Lớp này chưa được nạp sổ điểm!</p>`;
                return;
            }
            currentRoster = rosterSnap.data().students;

            const userSnap = await getDocs(query(collection(db, "users"), where("class", "==", className)));
            let usersInClass = [];
            userSnap.forEach(d => usersInClass.push({id: d.id, ...d.data()}));

            const assignSnap = await getDocs(collection(db, "exam_assignments"));
            let classAssignments = [];
            assignSnap.forEach(d => {
                const a = d.data();
                if (a.assignedClasses && a.assignedClasses.includes(className) && a.isOpen) {
                    classAssignments.push({ id: d.id, ...a });
                }
            });
            
            classAssignments.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

            let submissions = [];
            const chunkSize = 10;
            const assignmentIds = classAssignments.map(a => a.id);

            for (let i = 0; i < assignmentIds.length; i += chunkSize) {
                const chunk = assignmentIds.slice(i, i + chunkSize);
                if (chunk.length > 0) {
                    const subSnap = await getDocs(query(collection(db, "exam_submissions"), where("assignmentId", "in", chunk)));
                    submissions = submissions.concat(subSnap.docs.map(d => d.data()));
                }
            }

            let gradebookData = [];
            currentRoster.forEach((st, index) => {
                const normRosterName = normalizeName(st.name);
                const matchedUser = usersInClass.find(u => normalizeName(u.name) === normRosterName);
                
                let row = { stt: index + 1, rosterName: st.name, email: matchedUser ? matchedUser.email : "Chưa đăng ký" };
                
                classAssignments.forEach(a => {
                    if (matchedUser) {
                        const subs = submissions.filter(s => s.studentId === matchedUser.id && s.assignmentId === a.id && s.isPublished === true);
                        const scores = subs.map(s => s.score).filter(s => s !== null && s !== undefined);
                        const best = scores.length > 0 ? Math.max(...scores) : null;
                        row[a.id] = best !== null ? best : "";
                    } else {
                        row[a.id] = "";
                    }
                });

                gradebookData.push(row);
            });

            renderGradebook(gradebookData, classAssignments);
        } catch (err) {
            console.error(err);
            resultDiv.innerHTML = `<p style="color: var(--brown-d); text-align: center;">❌ Lỗi: ${escapeHTML(err.message)}</p>`;
        }
    }

    function renderGradebook(data, assignments) {
        const resultDiv = document.getElementById('gradebookResult');
        if (assignments.length === 0) {
            return resultDiv.innerHTML = "<p>Lớp này chưa có đề nào đang mở.</p>";
        }

        let html = `<table id="excelTable"><thead><tr>
            <th class="stt-col">STT</th>
            <th>Họ Tên (Từ sổ điểm)</th><th>Email</th>`;
        
        assignments.forEach(a => {
            html += `<th>${escapeHTML(a.title)}</th>`;
        });
        html += `</tr></thead><tbody>`;

        data.forEach((row) => {
            html += `<tr class="data-row">
                <td class="stt-col">${row.stt}</td>
                <td><b>${escapeHTML(row.rosterName)}</b></td>
                <td style="font-size: 12px; color: #555;">${escapeHTML(row.email)}</td>`;
            assignments.forEach(a => {
                const score = row[a.id];
                const color = score !== "" ? 'color: var(--primary); font-weight: bold;' : 'color: var(--border);';
                html += `<td style="${color} text-align: center;">${escapeHTML(score)}</td>`;
            });
            html += `</tr>`;
        });
        resultDiv.innerHTML = html + `</tbody></table>`;
    }

    window.uploadRoster = function() {
        const classId = document.getElementById('uploadClassId').value.trim().toLowerCase();
        const fileInput = document.getElementById('uploadRosterFile');
        const div = document.getElementById('studentListTable');

        if (!classId) return alert("Vui lòng nhập tên lớp!");
        if (!fileInput.files.length) return alert("Vui lòng chọn file Excel/CSV!");

        if (!confirm(`Bạn có chắc muốn nạp sổ điểm cho lớp ${classId.toUpperCase()}?\n\nLưu ý: Dữ liệu sổ điểm cũ của lớp này (nếu có) sẽ bị GHI ĐÈ!`)) return;

        setBtnLoading('btnUploadRoster', true);
        div.innerHTML = "<p style='color: var(--primary);'>⏳ Đang đọc file và nạp lên Firebase...</p>";

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const firstSheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1}); 

                let students = [];
                let stt = 1;
                
                rows.forEach(row => {
                    let name = "";
                    if (row.length >= 2) name = row[1]; 
                    else if (row.length === 1) name = row[0]; 
                    
                    if (name && typeof name === 'string' && name.trim() !== "" 
                        && !name.toLowerCase().includes('họ và tên') 
                        && !name.toLowerCase().includes('stt')) {
                        students.push({ stt: stt++, name: name.trim() });
                    }
                });

                if (students.length === 0) {
                    div.innerHTML = "<p style='color: var(--brown-d);'>Lỗi: File không có dữ liệu hợp lệ!</p>";
                    setBtnLoading('btnUploadRoster', false);
                    return alert("File không có dữ liệu hợp lệ! Cần cột Họ Tên ở vị trí thứ 2 hoặc cột đầu tiên.");
                }

                const { db } = await import('/bx/firebase-init.js');
                const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
                
                await setDoc(doc(db, "exam_rosters", classId), {
                    students: students,
                    updatedAt: new Date()
                });

                alert(`✅ Đã nạp thành công ${students.length} học sinh cho lớp ${classId}!`);
                document.getElementById('inputClassStudentTab').value = classId;
                loadAllUsersAndRender();
                
            } catch (error) {
                console.error("Lỗi nạp sổ điểm:", error);
                div.innerHTML = `<p style='color: var(--brown-d);'>Lỗi nạp sổ điểm: ${escapeHTML(error.message)}.</p>`;
            } finally {
                setBtnLoading('btnUploadRoster', false);
            }
        };
        reader.readAsArrayBuffer(file);
    }

        } finally {
            setBtnLoading('btnReloadUsers', false);
        }
    }

    window.renderStudentTable = function(roster, users) {
        const div = document.getElementById('studentListTable');
        const keyword = document.getElementById('searchStudentTab').value.trim().toLowerCase();

        if (roster.length === 0 && users.length === 0) {
            return div.innerHTML = "<p style='text-align: center;'>Lớp này chưa có sổ điểm và chưa có học sinh đăng ký.</p>";
        }

        let html = `<table><thead><tr>
            <th class="stt-col">STT</th>
            <th>Họ Tên (Sổ Điểm)</th><th>Email</th><th>Xác thực</th><th>Trạng thái Hồ sơ</th><th>Hành động</th>
        </tr></thead><tbody>`;

        let matchedUserIds = new Set();

        if (roster.length > 0) {
            roster.forEach((st, index) => {
                const normName = normalizeName(st.name);
                const user = users.find(u => normalizeName(u.name) === normName);
                
                if (user) matchedUserIds.add(user.id);
                if (keyword && !st.name.toLowerCase().includes(keyword) && (!user || !user.email.toLowerCase().includes(keyword))) return;

                const verifyStatus = user 
                    ? (user.isVerified ? '<span class="status-badge status-published">Đã xác thực</span>' : '<span class="status-badge status-pending">Chưa xác thực</span>')
                    : '<span class="status-badge" style="background:var(--border); color:#555;">Chưa ĐK</span>';
                
                let lockStatus = '-';
                if (user) {
                    lockStatus = user.infoLocked ? '<span style="color:var(--brown-d); font-weight:bold;">Đã khóa</span>' : '<span style="color:green;">Mở</span>';
                }

                const accountStatus = user 
                    ? (user.isHidden ? '<span class="status-badge status-hidden">Đã khóa TK</span>' : '<span class="status-badge status-published">Hoạt động</span>')
                    : '';

                html += `<tr>
                    <td class="stt-col">${index + 1}</td>
                    <td><b>${escapeHTML(st.name)}</b></td>
                    <td>${user ? escapeHTML(user.email) : '<i style="color:#888">Chưa đăng ký</i>'}</td>
                    <td>${verifyStatus}</td>
                    <td>${lockStatus} <br><small>${accountStatus}</small></td>
                    <td>${user ? `<button class="btn btn-sm ${user.isHidden ? 'btn-success' : 'btn-warning'}" onclick="toggleUserStatus('${user.id}', ${user.isHidden})">${user.isHidden ? 'Mở khóa TK' : 'Khóa TK'}</button>` : ''}</td>
                </tr>`;
            });
        }

        const unmatchedUsers = users.filter(u => !matchedUserIds.has(u.id));
        
        if (unmatchedUsers.length > 0) {
            html += `<tr><td colspan="6" style="background: var(--beige); color: var(--brown-d); font-weight: bold; text-align: center;">CẢNH BÁO: Học sinh đăng ký nhưng TÊN KHÔNG KHỚP với Sổ Điểm</td></tr>`;
            unmatchedUsers.forEach(u => {
                if (keyword && !u.name.toLowerCase().includes(keyword) && !u.email.toLowerCase().includes(keyword)) return;
                const verifyStatus = u.isVerified ? '<span class="status-badge status-published">Đã xác thực</span>' : '<span class="status-badge status-pending">Chưa xác thực</span>';
                const accountStatus = u.isHidden ? '<span class="status-badge status-hidden">Đã khóa TK</span>' : '<span class="status-badge status-published">Hoạt động</span>';
                const lockStatus = u.infoLocked ? '<span style="color:var(--brown-d); font-weight:bold;">Đã khóa</span>' : '<span style="color:green;">Mở</span>';

                html += `<tr style="background: var(--wheat);">
                    <td class="stt-col">-</td>
                    <td><b>${escapeHTML(u.name || '<Chưa đặt tên>')}</b> <span style="color:var(--brown-d); font-size:12px;">(Không khớp)</span></td>
                    <td>${escapeHTML(u.email)}</td>
                    <td>${verifyStatus}</td>
                    <td>${lockStatus} <br><small>${accountStatus}</small></td>
                    <td><button class="btn btn-sm ${u.isHidden ? 'btn-success' : 'btn-warning'}" onclick="toggleUserStatus('${u.id}', ${u.isHidden})">${u.isHidden ? 'Mở khóa TK' : 'Khóa TK'}</button></td>
                </tr>`;
            });
        }

        div.innerHTML = html + `</tbody></table>`;
    }

    window.toggleUserStatus = async function(uid, currentHidden) {
        const action = currentHidden ? "MỞ KHÓA" : "KHÓA TÀI KHOẢN";
        if (!confirm(`Bạn có chắc muốn ${action} đăng nhập của tài khoản này?`)) return;
        const { db } = await import('/bx/firebase-init.js');
        const { doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        await updateDoc(doc(db, "users", uid), { hidden: !currentHidden });
        loadAllUsersAndRender();
    }

    window.toggleClassProfileLock = async function(isLock) {
        const className = document.getElementById('inputClassStudentTab').value.trim().toLowerCase();
        if (!className) return alert("Vui lòng nhập tên lớp ở ô lọc trước khi thực hiện!");
        
        const action = isLock ? "KHÓA" : "MỞ KHÓA";
        if (!confirm(`Bạn có chắc chắn muốn ${action} quyền sửa Hồ sơ (Tên/Lớp) cho TẤT CẢ học sinh lớp ${className.toUpperCase()}?`)) return;

        const btnId = isLock ? 'btnLockClass' : 'btnUnlockClass';
        setBtnLoading(btnId, true);

        try {
            const { db } = await import('/bx/firebase-init.js');
            const { collection, query, where, getDocs, doc, writeBatch } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

            const snap = await getDocs(query(collection(db, "users"), where("class", "==", className)));
            if (snap.empty) {
                alert("Không tìm thấy học sinh nào trong lớp này!");
                return;
            }

            const batch = writeBatch(db);
            snap.forEach(d => {
                const userRef = doc(db, "users", d.id);
                batch.update(userRef, { infoLocked: isLock });
            });

            await batch.commit();
            alert(`✅ Đã ${action} thành công hồ sơ của ${snap.size} học sinh lớp ${className.toUpperCase()}!`);
            
            loadAllUsersAndRender();

        } catch (error) {
            console.error("Lỗi khóa hàng loạt:", error);
            alert("Lỗi: " + error.message);
        } finally {
            setBtnLoading(btnId, false, isLock ? '🔒 Khóa sửa Hồ Sơ' : '🔓 Mở khóa sửa Hồ Sơ');
        }
    }
</script>
</body>
</html>
