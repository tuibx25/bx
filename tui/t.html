<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ ngày giờ</title>
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/tuibx25/images/bx/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #8B5A2B;
            color: #D3D3D3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .time-container {
            background: rgba(0, 0, 0, 0.25);
            padding: 80px 100px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(211, 211, 211, 0.3);
        }

        .date {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: capitalize;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
        }

        .time {
            font-size: 10rem;
            font-weight: 900;
            letter-spacing: 6px;
            font-variant-numeric: tabular-nums;
            text-shadow: 4px 4px 15px rgba(0, 0, 0, 0.6);
            line-height: 1;
        }

        .seconds {
            font-size: 5rem;
            opacity: 0.85;
        }

        .status {
            margin-top: 25px;
            font-size: 0.95rem;
            opacity: 0.7;
            font-style: italic;
        }

        .status.ok { color: #b8e994; }
        .status.warn { color: #f8c291; }

        @media (max-width: 1024px) {
            .time-container { padding: 50px 60px; }
            .date { font-size: 3rem; }
            .time { font-size: 7rem; }
            .seconds { font-size: 3.5rem; }
        }

        @media (max-width: 768px) {
            .time-container { padding: 40px 30px; }
            .date { font-size: 2rem; }
            .time { font-size: 4.5rem; letter-spacing: 3px; }
            .seconds { font-size: 2.5rem; }
        }

        @media (max-width: 480px) {
            .time-container { padding: 30px 20px; }
            .date { font-size: 1.5rem; }
            .time { font-size: 3rem; letter-spacing: 2px; }
            .seconds { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="time-container">
        <div class="date" id="date">Đang tải...</div>
        <div class="time">
            <span id="hours">--</span>:<span id="minutes">--</span><span class="seconds">:<span id="seconds">--</span></span>
        </div>
        <div class="status" id="status"></div>
    </div>

    <script>
        // Múi giờ Hà Nội: UTC+7
        const HANOI_TZ = 'Asia/Ho_Chi_Minh';
        const HANOI_OFFSET_HOURS = 7;

        // Độ lệch giữa giờ server và giờ máy (ms): serverTime - localTime
        let serverTimeOffset = 0;
        let isSynced = false;

        // Hàm lấy thời gian từ WorldTimeAPI (hỗ trợ CORS)
        async function syncWithWorldTimeApi() {
            const response = await fetch(
                'https://worldtimeapi.org/api/timezone/Asia/Ho_Chi_Minh',
                { cache: 'no-store' }
            );
            if (!response.ok) throw new Error('WorldTimeAPI HTTP ' + response.status);

            const data = await response.json();
            // unixtime: Unix timestamp (giây)
            if (typeof data.unixtime !== 'number') {
                throw new Error('Dữ liệu WorldTimeAPI không hợp lệ');
            }
            return data.unixtime * 1000;
        }

        // Hàm dự phòng: Time.Now API
        async function syncWithTimeNowApi() {
            const response = await fetch(
                'https://time.now/developer/api/timezone/Asia/Ho_Chi_Minh',
                { cache: 'no-store' }
            );
            if (!response.ok) throw new Error('Time.Now HTTP ' + response.status);

            const data = await response.json();
            // API này có thể trả về "unixtime"
            if (typeof data.unixtime === 'number') {
                return data.unixtime * 1000;
            }
            // Hoặc trả về datetime dạng ISO
            if (data.datetime) {
                return new Date(data.datetime).getTime();
            }
            throw new Error('Dữ liệu Time.Now không hợp lệ');
        }

        // Hàm đồng bộ chính: thử lần lượt các API
        async function syncTime() {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status';

            const apis = [
                { name: 'WorldTimeAPI', fn: syncWithWorldTimeApi },
                { name: 'Time.Now',     fn: syncWithTimeNowApi }
            ];

            for (const api of apis) {
                try {
                    const serverMs = await api.fn();
                    const localMs = Date.now();
                    serverTimeOffset = serverMs - localMs;
                    isSynced = true;

                    statusEl.textContent =
                        `Đã đồng bộ với ${api.name} (Hà Nội, UTC+7)`;
                    statusEl.classList.add('ok');
                    return;
                } catch (err) {
                    console.warn(`[${api.name}] lỗi:`, err.message);
                }
            }

            // Cả hai API đều thất bại
            isSynced = false;
            serverTimeOffset = 0;
            statusEl.textContent =
                'Không thể đồng bộ trực tuyến – đang dùng giờ máy + bù UTC+7';
            statusEl.classList.add('warn');
        }

        // Trả về thời gian Hà Nội hiện tại
        function getHanoiNow() {
            if (isSynced) {
                // Dùng offset từ server (serverMs - localMs)
                // Vậy giờ server ≈ Date.now() + offset
                // Nhưng server đã trả về giờ Hà Nội (Asia/Ho_Chi_Minh) nên
                // timestamp này chính là UTC tuyệt đối.
                // Khi format với timeZone Hà Nội sẽ ra đúng giờ Hà Nội.
                return new Date(Date.now() + serverTimeOffset);
            }

            // Dự phòng: lấy UTC của máy + 7 giờ
            const nowUtcMs = Date.now() + new Date().getTimezoneOffset() * 60 * 1000;
            return new Date(nowUtcMs + HANOI_OFFSET_HOURS * 3600 * 1000);
        }

        const dateFormatter = new Intl.DateTimeFormat('vi-VN', {
            timeZone: HANOI_TZ,
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        const timeFormatter = new Intl.DateTimeFormat('vi-VN', {
            timeZone: HANOI_TZ,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });

        function updateClock() {
            const now = getHanoiNow();

            const dateStr = dateFormatter.format(now);
            const parts = timeFormatter.formatToParts(now);

            let hh = '--', mm = '--', ss = '--';
            for (const p of parts) {
                if (p.type === 'hour')   hh = p.value;
                if (p.type === 'minute') mm = p.value;
                if (p.type === 'second') ss = p.value;
            }

            document.getElementById('date').textContent = dateStr;
            document.getElementById('hours').textContent = hh;
            document.getElementById('minutes').textContent = mm;
            document.getElementById('seconds').textContent = ss;
        }

        async function init() {
            // Hiển thị tạm giờ máy + bù UTC+7 ngay lập tức
            updateClock();
            setInterval(updateClock, 1000);

            // Đồng bộ với server
            await syncTime();
            updateClock();

            // Đồng bộ lại mỗi 10 phút
            setInterval(async () => {
                await syncTime();
                updateClock();
            }, 10 * 60 * 1000);
        }

        init();
    </script>
</body>
</html>
