<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ ngày giờ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #8B5A2B;
            color: #D3D3D3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .time-container {
            background: rgba(0, 0, 0, 0.25);
            padding: 80px 100px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(211, 211, 211, 0.3);
        }

        .date {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: capitalize;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
        }

        .time {
            font-size: 10rem;
            font-weight: 900;
            letter-spacing: 6px;
            font-variant-numeric: tabular-nums;
            text-shadow: 4px 4px 15px rgba(0, 0, 0, 0.6);
            line-height: 1;
        }

        .seconds {
            font-size: 5rem;
            opacity: 0.85;
        }

        @media (max-width: 1024px) {
            .time-container {
                padding: 50px 60px;
            }
            .date {
                font-size: 3rem;
            }
            .time {
                font-size: 7rem;
            }
            .seconds {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 768px) {
            .time-container {
                padding: 40px 30px;
            }
            .date {
                font-size: 2rem;
            }
            .time {
                font-size: 4.5rem;
                letter-spacing: 3px;
            }
            .seconds {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .time-container {
                padding: 30px 20px;
            }
            .date {
                font-size: 1.5rem;
            }
            .time {
                font-size: 3rem;
                letter-spacing: 2px;
            }
            .seconds {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="time-container">
        <div class="date" id="date">Đang tải...</div>
        <div class="time">
            <span id="hours">--</span>:<span id="minutes">--</span><span class="seconds">:<span id="seconds">--</span></span>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const dateOptions = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            const dateStr = now.toLocaleDateString('vi-VN', dateOptions);

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('date').textContent = dateStr;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
