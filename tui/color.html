<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color TuiBX</title>
	<link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/tuibx25/images/bx/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #e9eef2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 1.25rem;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .color-card {
            background: white;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.2), 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s ease, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            cursor: pointer;
            user-select: none;
        }

        .color-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 22px 34px -12px rgba(0, 0, 0, 0.35);
        }

        .color-swatch {
            padding: 1.8rem 0.5rem 1.4rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 130px;
        }

        .hex-code {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.5), 0 2px 4px rgba(0,0,0,0.2);
            background: rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(2px);
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-family: 'Fira Mono', 'Cascadia Code', monospace;
            margin-bottom: 0.4rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .color-name {
            font-size: 1rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(3px);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            color: #1e293b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.7);
            max-width: 90%;
        }

        .copy-toast {
            background: #1e1e2f;
            color: white;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.3rem 0;
            letter-spacing: 0.3px;
            transform: translateY(100%);
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            margin-top: auto;
            border-top: 1px solid rgba(255,215,0,0.3);
        }

        .color-card.copy-active .copy-toast {
            transform: translateY(0);
        }

        .dark-swatch .color-name {
            background: rgba(30, 30, 40, 0.8);
            color: #f0f3fa;
            border-color: #5f5f7a;
        }
    </style>
</head>
<body>
    <div class="palette-grid" id="paletteContainer"></div>

    <script>
        (function() {
            const rawColors = [
                "#8B5A2B",
                "#804000",
                "#8B4513",
                "#FFFFFF",
                "#F5F5F5",
                "#F5F5DC",
                "#FFFFCC",
                "#F5DEB3",
                "#D3D3D3",
                "#C0C0C0",
                "#D2B48C",
                "#D2B48C",
                "#A9A9A9",
                "#808080",
                "#0066CC",
                "#004488",
                "#2C3E50",
                "#1C3A5F"
            ];

            const colorCount = {};
            rawColors.forEach(hex => {
                colorCount[hex] = (colorCount[hex] || 0) + 1;
            });

            function getColorName(hex, occurrenceIndex) {
                const map = {
                    "#8B5A2B": "nâu đất",
                    "#804000": "nâu cánh gián",
                    "#8B4513": "nâu gụ",
                    "#FFFFFF": "trắng tinh",
                    "#F5F5F5": "trắng xám nhạt",
                    "#F5F5DC": "màu be",           // ĐÃ SỬA: từ "trắng ngà" → "màu be"
                    "#FFFFCC": "vàng kem",
                    "#F5DEB3": "vàng lúa mì",
                    "#D3D3D3": "xám nhạt",
                    "#C0C0C0": "xám bạc",
                    "#D2B48C": "nâu gỗ",            // tên gốc cho lần gặp đầu
                    "#A9A9A9": "xám đậm",
                    "#808080": "xám",
                    "#0066CC": "xanh lam sáng",
                    "#004488": "xanh dương đậm",
                    "#2C3E50": "xanh than đá",
                    "#1C3A5F": "xanh biển sâu"
                };

                // Xử lý riêng cho #D2B48C (hai ô nâu gỗ phân biệt)
                if (hex === "#D2B48C") {
                    if (occurrenceIndex === 0) {
                        return "nâu gỗ sáng";    // ô thứ nhất
                    } else {
                        return "nâu gỗ trầm";     // ô thứ hai
                    }
                }

                return map[hex] || "màu sắc";
            }

            function isDark(hex) {
                let r, g, b;
                if (hex.length === 7) {
                    r = parseInt(hex.slice(1, 3), 16);
                    g = parseInt(hex.slice(3, 5), 16);
                    b = parseInt(hex.slice(5, 7), 16);
                } else {
                    return false;
                }
                const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                return luminance < 0.5;
            }

            const container = document.getElementById('paletteContainer');
            if (!container) return;

            const encountered = {};

            rawColors.forEach((hexCode) => {
                const upperHex = hexCode.toUpperCase();
                
                encountered[upperHex] = (encountered[upperHex] || 0) + 1;
                const occurrence = encountered[upperHex] - 1;

                const colorName = getColorName(upperHex, occurrence);
                const dark = isDark(upperHex);

                const card = document.createElement('div');
                card.className = `color-card ${dark ? 'dark-swatch' : ''}`;
                card.setAttribute('data-hex', upperHex);

                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = upperHex;

                const hexSpan = document.createElement('span');
                hexSpan.className = 'hex-code';
                hexSpan.textContent = upperHex;
                hexSpan.style.backgroundColor = dark ? 'rgba(20,20,30,0.45)' : 'rgba(255,255,240,0.55)';
                hexSpan.style.color = dark ? '#f5f0e6' : '#18181a';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'color-name';
                nameSpan.textContent = colorName;

                swatch.appendChild(hexSpan);
                swatch.appendChild(nameSpan);

                const toast = document.createElement('div');
                toast.className = 'copy-toast';
                toast.textContent = '✓ đã copy';

                card.appendChild(swatch);
                card.appendChild(toast);

                card.addEventListener('click', async function(e) {
                    const hex = this.getAttribute('data-hex');
                    try {
                        await navigator.clipboard.writeText(hex);
                        this.classList.add('copy-active');
                        setTimeout(() => {
                            this.classList.remove('copy-active');
                        }, 800);
                    } catch (err) {
                        alert('Không copy được: ' + hex);
                    }
                });

                container.appendChild(card);
            });
        })();
    </script>
</body>
</html>
