<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color TuiBX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .color-card {
            border-radius: 16px;
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
            min-height: 140px;
        }

        .color-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.18);
            filter: brightness(1.02);
        }

        .color-card:active {
            transform: scale(0.98);
        }

        .color-code {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .color-name {
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.95;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        /* màu chữ tự động: light-text / dark-text được thêm bằng JS */
        .light-text {
            color: #ffffff;
        }
        .dark-text {
            color: #1e1e2a;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2b3c;
            color: #f8fafc;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .toast.show {
            opacity: 1;
        }

        /* không có header, không có footer — chỉ lưới màu */
    </style>
</head>
<body>

    <div class="grid" id="colorGrid"></div>
    <div class="toast" id="toast">📋 Đã copy mã màu!</div>

    <script>
        (function() {
            // --- Danh sách mã màu từ color.txt kèm tên tiếng Việt ---
            const colors = [
                { hex: "#8B5A2B", name: "Nâu đất" },
                { hex: "#8B4513", name: "Nâu sẫm" },
                { hex: "#FFFFFF", name: "Trắng" },
                { hex: "#F5F5F5", name: "Trắng xám" },
                { hex: "#F5F5DC", name: "Be" },
                { hex: "#F5DEB3", name: "Vàng nhạt" },
                { hex: "#D3D3D3", name: "Xám nhạt" },
                { hex: "#C0C0C0", name: "Bạc" },
                { hex: "#D2B48C", name: "Nâu nhạt" },
                { hex: "#A9A9A9", name: "Xám đậm" },
                { hex: "#808080", name: "Xám" },
                { hex: "#0066CC", name: "Xanh dương đậm" },
                { hex: "#004488", name: "Xanh navy" },
                { hex: "#2C3E50", name: "Xanh than" },
                { hex: "#1C3A5F", name: "Xanh đêm" }
            ];

            // --- Hàm tính độ sáng (luma) để chọn màu chữ tương phản ---
            function getLuminance(hex) {
                // Chuẩn hóa: cắt bỏ # nếu có
                let r = parseInt(hex.slice(1, 3), 16);
                let g = parseInt(hex.slice(3, 5), 16);
                let b = parseInt(hex.slice(5, 7), 16);
                // Công thức W3C: 0.299*R + 0.587*G + 0.114*B
                return (0.299 * r + 0.587 * g + 0.114 * b);
            }

            // --- Hàm hiển thị toast ---
            function showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message || '📋 Đã copy mã màu!';
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 1500);
            }

            // --- Hàm copy vào clipboard (hiện đại + fallback) ---
            async function copyToClipboard(text, hexForMessage) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast(`📋 Đã copy ${hexForMessage}`);
                } catch (err) {
                    // fallback cho trình duyệt cũ
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(`📋 Đã copy ${hexForMessage}`);
                }
            }

            // --- Render toàn bộ ô màu ---
            function renderColorGrid() {
                const grid = document.getElementById('colorGrid');
                if (!grid) return;

                // Xóa nội dung cũ (nếu có)
                grid.innerHTML = '';

                colors.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'color-card';
                    card.style.backgroundColor = c.hex;

                    // Xác định class màu chữ
                    const luminance = getLuminance(c.hex);
                    card.classList.add(luminance > 128 ? 'dark-text' : 'light-text');

                    // Tạo phần tử mã màu
                    const codeDiv = document.createElement('div');
                    codeDiv.className = 'color-code';
                    codeDiv.textContent = c.hex;

                    // Tạo phần tử tên màu
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'color-name';
                    nameDiv.textContent = c.name;

                    card.appendChild(codeDiv);
                    card.appendChild(nameDiv);

                    // Sự kiện click copy mã hex
                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        copyToClipboard(c.hex, c.hex);
                    });

                    grid.appendChild(card);
                });
            }

            // --- Khởi chạy khi DOM sẵn sàng ---
            document.addEventListener('DOMContentLoaded', renderColorGrid);
        })();
    </script>
</body>
</html>
