<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vật Lý 12 KNTT</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary: #8B4513;
            --primary-light: #A0522D;
            --primary-dark: #654321;
            --secondary: #D2B48C;
            --secondary-light: #E6D3B9;
            --secondary-dark: #B8860B;
            --accent: #5D4037;
            --success: #8D6E63;
            --dark: #3E2723;
            --light: #FFF8E1;
            --neutral: #BCAAA4;
            
            --bg-light: #F5F5F5;
            --bg-card: #FFFFFF;
            
            --shadow: 0 10px 30px rgba(139, 69, 19, 0.1);
            --shadow-hover: 0 20px 50px rgba(139, 69, 19, 0.15);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            /* Chống chọn văn bản */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Watermark bảo vệ */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdn.jsdelivr.net/gh/tuibx25/images/bx/tuibx.png');
            background-repeat: repeat;
            background-size: 350px 120px;
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
        }
        
        body {
            background-color: var(--bg-light);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(139, 69, 19, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(93, 64, 55, 0.05) 0%, transparent 50%);
            z-index: -1;
        }
        
        /* Lớp bảo vệ chống xem mã nguồn */
        .protector {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 30px;
            background-color: var(--primary);
            border-radius: 24px;
            color: white;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--primary-dark);
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background-color: var(--secondary);
            animation: shimmer 3s infinite linear;
        }
        
        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }
        
        .header-content {
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            color: var(--light);
        }
        
        .chapters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        
        .chapter-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--secondary-light);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .chapter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(210, 180, 140, 0.1) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        
        .chapter-card:hover::before {
            transform: translateX(100%);
        }
        
        .chapter-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }
        
        .chapter-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--secondary);
        }
        
        .chapter-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background-color: var(--primary);
        }
        
        .chapter-card:nth-child(1) .chapter-icon { background-color: var(--primary); }
        .chapter-card:nth-child(2) .chapter-icon { background-color: var(--accent); }
        .chapter-card:nth-child(3) .chapter-icon { background-color: var(--success); }
        .chapter-card:nth-child(4) .chapter-icon { background-color: var(--primary-dark); }
        
        .chapter-title {
            color: var(--dark);
            font-size: 1.5rem;
            font-weight: 600;
            flex: 1;
        }
        
        .lesson-list {
            list-style-type: none;
        }
        
        .lesson-item {
            padding: 0;
            margin-bottom: 8px;
            position: relative;
        }
        
        .lesson-link {
            text-decoration: none;
            color: var(--dark);
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            transition: all 0.3s;
            background: var(--light);
            border: 1px solid var(--secondary-light);
            position: relative;
            overflow: hidden;
            /* Cho phép tương tác trên link */
            pointer-events: auto;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        .lesson-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform 0.3s;
        }
        
        .lesson-link:hover {
            background: white;
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.08);
            border-color: var(--primary);
        }
        
        .lesson-link:hover::before {
            transform: scaleY(1);
        }
        
        .lesson-link:hover .lesson-arrow {
            transform: translateX(5px);
            opacity: 1;
            color: var(--primary);
        }
        
        .lesson-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: var(--primary);
            color: white;
            border-radius: 10px;
            margin-right: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(139, 69, 19, 0.3);
            flex-shrink: 0;
        }
        
        .lesson-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .lesson-title {
            font-weight: 500;
            margin-bottom: 3px;
            color: var(--dark);
        }
        
        .lesson-subtitle {
            font-size: 0.85rem;
            opacity: 0.7;
            color: var(--accent);
        }
        
        .lesson-arrow {
            width: 24px;
            height: 24px;
            opacity: 0.5;
            transition: all 0.3s;
            color: var(--primary);
        }
        
        .home-button {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            z-index: 10;
            pointer-events: auto;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        .home-button:hover {
            background: white;
            color: var(--primary-dark);
            transform: translateY(-50%) translateX(-5px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.2);
            border-color: var(--primary);
        }
        
        .home-button .button-icon {
            transition: transform 0.3s;
        }
        
        .home-button:hover .button-icon {
            transform: translateX(-3px);
        }
        
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            color: var(--dark);
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--secondary-light);
        }
        
        .footer-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .footer-subtext {
            opacity: 0.7;
            font-size: 0.9rem;
            color: var(--accent);
        }
        
        /* Floating particles */
        .particle {
            position: fixed;
            border-radius: 50%;
            background-color: var(--primary);
            opacity: 0.05;
            z-index: -1;
        }
        
        /* Progress indicator */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: var(--primary);
            z-index: 1000;
            transition: width 0.3s;
        }
        
        @media (max-width: 768px) {
            .chapters {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            h1 {
                font-size: 2.2rem;
                margin-top: 20px;
            }
            
            .home-button {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                margin: 0 auto 20px;
                display: inline-flex;
                width: fit-content;
            }
            
            header {
                padding: 30px 20px;
                text-align: center;
            }
            
            .chapter-card {
                padding: 25px;
            }
            
            .lesson-link {
                padding: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .chapters {
                grid-template-columns: 1fr;
            }
        }
        
        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chapter-card {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .chapter-card:nth-child(1) { animation-delay: 0.1s; }
        .chapter-card:nth-child(2) { animation-delay: 0.2s; }
        .chapter-card:nth-child(3) { animation-delay: 0.3s; }
        .chapter-card:nth-child(4) { animation-delay: 0.4s; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Lớp bảo vệ chống xem mã nguồn -->
    <div class="protector" id="pageProtector"></div>
    
    <div class="progress-bar" id="progressBar"></div>
    
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Vật Lý 12</h1>
                <p class="subtitle">Kết Nối Tri Thức Với Cuộc Sống</p>
                <a href="../" class="home-button">
                    <span class="button-icon">←</span>
                    Trang chủ
                </a>
            </div>
        </header>
        
        <div class="chapters" id="chapters-container">
            <!-- Nội dung sẽ được tạo tự động bằng JavaScript -->
        </div>
        
        <footer>
            <p class="footer-text">TuiBX</p>
            <p class="footer-subtext">© 2025 - Tài liệu học tập Vật Lý 12</p>
        </footer>
    </div>

    <script>
        // ========== HỆ THỐNG BẢO MẬT KHÔNG CẢNH BÁO ==========
        
        // 1. Chống nhấp chuột phải (KHÔNG HIỂN THỊ CẢNH BÁO)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // 2. Chống các phím tắt xem mã nguồn và DevTools (KHÔNG HIỂN THỊ CẢNH BÁO)
        const blockedShortcuts = [
            { key: 'F12', ctrl: false, shift: false },
            { key: 'I', ctrl: true, shift: true },
            { key: 'J', ctrl: true, shift: true },
            { key: 'C', ctrl: true, shift: true },
            { key: 'U', ctrl: true, shift: false },
            { key: 'S', ctrl: true, shift: false }
        ];
        
        document.addEventListener('keydown', function(e) {
            // Kiểm tra từng tổ hợp phím bị chặn
            for (const shortcut of blockedShortcuts) {
                const ctrlMatch = shortcut.ctrl === e.ctrlKey;
                const shiftMatch = shortcut.shift === e.shiftKey;
                const altMatch = !shortcut.alt || shortcut.alt === e.altKey;
                const metaMatch = !shortcut.meta || shortcut.meta === e.metaKey;
                const keyMatch = e.key.toUpperCase() === shortcut.key.toUpperCase();
                
                if (ctrlMatch && shiftMatch && altMatch && metaMatch && keyMatch) {
                    e.preventDefault();
                    return false;
                }
            }
            
            // Chặn F12 riêng biệt
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+S
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                return false;
            }
        });
        
        // 3. Chống sao chép nội dung (KHÔNG HIỂN THỊ CẢNH BÁO)
        document.addEventListener('copy', function(e) {
            e.preventDefault();
            return false;
        });
        
        // 4. Chống cắt nội dung
        document.addEventListener('cut', function(e) {
            e.preventDefault();
            return false;
        });
        
        // 5. Chống kéo thả hình ảnh và nội dung
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
        
        // 6. Chống chọn văn bản (ngoại trừ các liên kết và nút)
        document.addEventListener('selectstart', function(e) {
            const target = e.target;
            const isAllowed = target.closest('.lesson-link') || 
                            target.closest('.home-button') ||
                            target.closest('input') ||
                            target.closest('textarea');
            
            if (!isAllowed) {
                e.preventDefault();
                return false;
            }
        });
        
        // 7. Phát hiện và chống mở Developer Tools (KHÔNG HIỂN THỊ CẢNH BÁO)
        let devToolsOpened = false;
        const devToolsThreshold = 160;
        
        function detectDevTools() {
            const widthDiff = Math.abs(window.outerWidth - window.innerWidth);
            const heightDiff = Math.abs(window.outerHeight - window.innerHeight);
            
            if (widthDiff > devToolsThreshold || heightDiff > devToolsThreshold) {
                if (!devToolsOpened) {
                    devToolsOpened = true;
                    // Chỉ làm mờ trang, không hiển thị cảnh báo
                    document.body.style.filter = 'blur(5px)';
                    document.body.style.opacity = '0.7';
                    document.body.style.pointerEvents = 'none';
                }
            } else {
                if (devToolsOpened) {
                    devToolsOpened = false;
                    // Khôi phục trạng thái ban đầu
                    document.body.style.filter = 'none';
                    document.body.style.opacity = '1';
                    document.body.style.pointerEvents = 'auto';
                }
            }
        }
        
        // Kiểm tra DevTools định kỳ
        setInterval(detectDevTools, 1000);
        
        // 8. Bảo vệ khi người dùng cố gắng xem mã nguồn qua URL
        window.addEventListener('beforeunload', function(e) {
            // Thêm một lớp bảo vệ trước khi rời trang
            document.body.style.opacity = '0.5';
        });
        
        // ========== NỘI DUNG GỐC VẪN GIỮ NGUYÊN ==========
        
        const physicsChapters = [
            {
                title: "Chương I. VẬT LÍ NHIỆT",
                subtitle: "Nghiên cứu về nhiệt và cấu trúc chất",
                lessons: [
                    {title: "Cấu trúc của chất. Sự chuyển thế", type: "Lý thuyết"},
                    {title: "Nội năng. Định luật I của nhiệt động lực học", type: "Lý thuyết"},
                    {title: "Nhiệt độ. Thang nhiệt độ – nhiệt kế", type: "Lý thuyết"},
                    {title: "Nhiệt dung riêng", type: "Lý thuyết"},
                    {title: "Nhiệt nóng chảy riêng", type: "Lý thuyết"},
                    {title: "Nhiệt hoá hơi riêng", type: "Lý thuyết"},
                    {title: "Bài tập về vật lí nhiệt", type: "Bài tập"}
                ]
            },
            {
                title: "Chương II. KHÍ LÍ TƯỞNG",
                subtitle: "Mô hình và định luật về chất khí",
                lessons: [
                    {title: "Mô hình động học phân tử chất khí", type: "Lý thuyết"},
                    {title: "Định luật Boyle", type: "Lý thuyết"},
                    {title: "Định luật Charles", type: "Lý thuyết"},
                    {title: "Phương trình trạng thái của khí lí tưởng", type: "Lý thuyết"},
                    {title: "Áp suất khí theo mô hình động học phân tử. Quan hệ giữa động năng phân tử và nhiệt độ", type: "Lý thuyết"},
                    {title: "Bài tập về khí lí tưởng", type: "Bài tập"}
                ]
            },
            {
                title: "Chương III. TỪ TRƯỜNG",
                subtitle: "Từ trường và hiện tượng cảm ứng điện từ",
                lessons: [
                    {title: "Từ trường", type: "Lý thuyết"},
                    {title: "Lực từ tác dụng lên dây dẫn mang dòng điện. Cảm ứng từ", type: "Lý thuyết"},
                    {title: "Từ thông. Hiện tượng cảm ứng điện từ", type: "Lý thuyết"},
                    {title: "Máy phát điện xoay chiều", type: "Lý thuyết"},
                    {title: "Ứng dụng hiện tượng cảm ứng điện từ", type: "Lý thuyết"},
                    {title: "Điện từ trường. Mô hình sống điện từ", type: "Lý thuyết"},
                    {title: "Bài tập về từ trường", type: "Bài tập"}
                ]
            },
            {
                title: "Chương IV. VẬT LÍ HẠT NHÂN",
                subtitle: "Cấu trúc hạt nhân và phản ứng hạt nhân",
                lessons: [
                    {title: "Cấu trúc hạt nhân", type: "Lý thuyết"},
                    {title: "Phản ứng hạt nhân và năng lượng liên kết", type: "Lý thuyết"},
                    {title: "Hiện tượng phóng xạ", type: "Lý thuyết"},
                    {title: "Công nghiệp hạt nhân", type: "Lý thuyết"},
                    {title: "Bài tập về vật lí hạt nhân", type: "Bài tập"}
                ]
            }
        ];

        const chapterIcons = ["🔥", "🌡️", "🧲", "⚛️"];

        function generateLessonLink(lessonIndex) {
            const lessonNumber = (lessonIndex + 1).toString().padStart(2, '0');
            return `./${lessonNumber}/`;
        }

        function createParticles() {
            const colors = ['#8B4513', '#A0522D', '#5D4037', '#8D6E63'];
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.width = `${Math.random() * 100 + 50}px`;
                particle.style.height = particle.style.width;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.opacity = `${Math.random() * 0.1 + 0.05}`;
                particle.style.animation = `float ${Math.random() * 20 + 10}s infinite ease-in-out`;
                document.body.appendChild(particle);
            }
        }

        function updateProgressBar() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";
        }

        function renderChapters() {
            const container = document.getElementById('chapters-container');
            let lessonCounter = 0;
            
            physicsChapters.forEach((chapter, chapterIndex) => {
                const chapterCard = document.createElement('div');
                chapterCard.className = 'chapter-card';
                
                // Tạo header chương
                const chapterHeader = document.createElement('div');
                chapterHeader.className = 'chapter-header';
                
                const chapterIcon = document.createElement('div');
                chapterIcon.className = 'chapter-icon';
                chapterIcon.textContent = chapterIcons[chapterIndex];
                
                const chapterTitleDiv = document.createElement('div');
                chapterTitleDiv.className = 'chapter-title';
                chapterTitleDiv.innerHTML = `
                    <div>${chapter.title}</div>
                    <div style="font-size: 0.9rem; opacity: 0.7; font-weight: 400; margin-top: 5px;">
                        ${chapter.subtitle}
                    </div>
                `;
                
                chapterHeader.appendChild(chapterIcon);
                chapterHeader.appendChild(chapterTitleDiv);
                
                // Tạo danh sách bài học
                const lessonList = document.createElement('ul');
                lessonList.className = 'lesson-list';
                
                chapter.lessons.forEach((lesson, index) => {
                    const lessonItem = document.createElement('li');
                    lessonItem.className = 'lesson-item';
                    
                    const lessonLink = document.createElement('a');
                    lessonLink.className = 'lesson-link';
                    lessonLink.href = generateLessonLink(lessonCounter);
                    lessonLink.target = "_blank";
                    lessonLink.rel = "noopener noreferrer";
                    
                    // Tạo nội dung bài học
                    lessonLink.innerHTML = `
                        <div class="lesson-number">${(lessonCounter + 1).toString().padStart(2, '0')}</div>
                        <div class="lesson-content">
                            <div class="lesson-title">${lesson.title}</div>
                            <div class="lesson-subtitle">${lesson.type}</div>
                        </div>
                        <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    `;
                    
                    lessonLink.addEventListener('click', function(e) {
                        const lessonNum = (lessonCounter + 1).toString().padStart(2, '0');
                        console.log(`Chuyển đến bài ${lessonNum}: ${generateLessonLink(lessonCounter)}`);
                    });
                    
                    lessonItem.appendChild(lessonLink);
                    lessonList.appendChild(lessonItem);
                    lessonCounter++;
                });
                
                chapterCard.appendChild(chapterHeader);
                chapterCard.appendChild(lessonList);
                container.appendChild(chapterCard);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderChapters();
            createParticles();
            window.addEventListener('scroll', updateProgressBar);
        });
    </script>
</body>
</html>
