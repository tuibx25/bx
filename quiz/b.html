<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng Nhập / Đăng Ký - Hệ Thống Thi</title>
<script type="module" src="/bx/firebase-init.js"></script>
<style>
    :root { 
        --ink: #000000; --bg: #F5F5F5; --white: #FFFFFF;
        --border: #D3D3D3; --primary: #004488; --primary-light: #0066CC;
        --brown: #8B5A2B; --brown-d: #8B4513;
        --beige: #F5F5DC; --wheat: #F5DEB3;
    }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--ink); }
    .card { background: var(--white); width: 100%; max-width: 400px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid var(--border); }
    h2 { text-align: center; color: var(--primary); margin-top: 0; margin-bottom: 20px;}
    
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px;}
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; font-size: 14px;}
    .form-control:disabled { background: var(--bg); color: #888; cursor: not-allowed; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; color: var(--white); transition: 0.2s; background: var(--primary); }
    .btn:hover { background: var(--primary-light); }
    .btn-submit { background: var(--brown-d); }
    .btn-submit:hover { background: var(--brown); }
    
    .msg { padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; display: none; text-align: center; font-weight: bold;}
    .msg.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .msg.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .msg.info { display: block; background: var(--beige); color: var(--brown-d); border: 1px solid var(--wheat); }

    .hidden { display: none !important; }
    .note { font-size: 13px; color: #666; text-align: center; margin-top: 15px; }
    
    /* Thông tin cá nhân */
    .user-info { text-align: center; margin-bottom: 20px; }
    .user-info p { margin: 5px 0; }
</style>
</head>
<body>

<div class="card">
    <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="authSection">
        <h2>🎓 HỆ THỐNG THI ONLINE</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchAuthTab('login')">Đăng Nhập</button>
            <button class="tab-btn" onclick="switchAuthTab('register')">Đăng Ký</button>
        </div>

        <div id="alertMsg" class="msg"></div>

        <!-- Form Đăng Nhập -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="Nhập email...">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn" onclick="handleLogin()">Đăng Nhập</button>
            <p class="note">Nếu chưa có tài khoản, vui lòng chuyển sang tab Đăng Ký.</p>
        </div>

        <!-- Form Đăng Ký -->
        <div id="registerForm" class="hidden">
            <div class="form-group">
                <label>Họ và Tên:</label>
                <input type="text" id="regName" class="form-control" placeholder="VD: Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label>Lớp (VD: 10a1):</label>
                <input type="text" id="regClass" class="form-control" placeholder="VD: 10a1">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="regEmail" class="form-control" placeholder="Nhập email...">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 6 ký tự...">
            </div>
            <button class="btn btn-submit" onclick="handleRegister()">Đăng Ký Tài Khoản</button>
        </div>
    </div>

    <!-- 2. MÀN HÌNH HỒ SƠ CÁ NHÂN (SAU KHI ĐĂNG NHẬP) -->
    <div id="profileSection" class="hidden">
        <h2>👤 HỒ SƠ CÁ NHÂN</h2>
        <div class="user-info">
            <p>Email: <b id="pEmail"></b></p>
            <p>Trạng thái: <b id="pStatus" style="color: green;">Đã xác thực</b></p>
        </div>
        <div class="form-group">
            <label>Họ và Tên:</label>
            <input type="text" id="pName" class="form-control">
        </div>
        <div class="form-group">
            <label>Lớp:</label>
            <input type="text" id="pClass" class="form-control">
        </div>
        <div id="lockMsg" class="msg info hidden">⚠️ Tài khoản của bạn đã bị Giáo viên khóa. Không thể thay đổi thông tin.</div>
        
        <button class="btn btn-submit" id="btnSaveProfile" onclick="handleUpdateProfile()">Lưu Thay Đổi</button>
        <button class="btn" style="margin-top: 10px; background: #d9534f;" onclick="handleLogout()">Đăng Xuất</button>
        <a href="/bx/thi/index.html" class="btn" style="margin-top: 10px; display: block; text-align: center; text-decoration: none; background: var(--brown);">Đi Đến Trang Thi</a>
    </div>
</div>

<script>
    let currentUserDoc = null;

    window.addEventListener('load', () => {
        import('/bx/firebase-init.js').then(({ auth, onAuthStateChanged }) => {
            onAuthStateChanged(auth, (user) => {
                if (user && user.emailVerified) {
                    // Đã đăng nhập và xác thực email -> Hiển thị hồ sơ
                    loadUserProfile(user);
                } else {
                    // Chưa đăng nhập -> Hiển thị form
                    document.getElementById('authSection').classList.remove('hidden');
                    document.getElementById('profileSection').classList.add('hidden');
                }
            });
        });
    });

    function showMsg(text, type) {
        const el = document.getElementById('alertMsg');
        el.textContent = text;
        el.className = `msg ${type}`;
    }

    function switchAuthTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('alertMsg').className = 'msg'; // Ẩn thông báo cũ
        
        if (tab === 'login') {
            event.target.classList.add('active');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        } else {
            event.target.classList.add('active');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }
    }

    // XỬ LÝ ĐĂNG KÝ
    window.handleRegister = async function() {
        const name = document.getElementById('regName').value.trim();
        const className = document.getElementById('regClass').value.trim().toLowerCase();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!name || !className || !email || !password) {
            return showMsg("Vui lòng nhập đầy đủ thông tin!", "error");
        }
        if (password.length < 6) {
            return showMsg("Mật khẩu phải từ 6 ký tự trở lên!", "error");
        }

        try {
            const { auth, db, createUserWithEmailAndPassword, sendEmailVerification, doc, setDoc, signOut } = await import('/bx/firebase-init.js');
            
            showMsg("⏳ Đang tạo tài khoản...", "info");
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Lưu thông tin vào Firestore (Lúc này email chưa verify nên phải dùng setDoc)
            await setDoc(doc(db, "users", user.uid), {
                email: email,
                name: name,
                class: className,
                role: "student",
                emailVerified: false,
                infoLocked: false, // Mặc định chưa bị khóa
                createdAt: new Date()
            });

            // Gửi mail xác thực
            await sendEmailVerification(user);
            
            showMsg("✅ Đăng ký thành công! Vui lòng kiểm tra hộp thư email để xác thực tài khoản.", "success");
            
            // Đăng xuất ngay để bắt HS vào mail verify
            await signOut(auth);
            
            // Reset form
            document.getElementById('regName').value = "";
            document.getElementById('regClass').value = "";
            document.getElementById('regEmail').value = "";
            document.getElementById('regPassword').value = "";

        } catch (error) {
            console.error(error);
            if (error.code === 'auth/email-already-in-use') {
                showMsg("Email này đã được sử dụng!", "error");
            } else {
                showMsg("Lỗi đăng ký: " + error.message, "error");
            }
        }
    }

    // XỬ LÝ ĐĂNG NHẬP
    window.handleLogin = async function() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) return showMsg("Vui lòng nhập Email và Mật khẩu!", "error");

        try {
            const { auth, signInWithEmailAndPassword, signOut } = await import('/bx/firebase-init.js');
            
            showMsg("⏳ Đang đăng nhập...", "info");
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            
            if (!userCredential.user.emailVerified) {
                await signOut(auth);
                return showMsg("❌ Tài khoản chưa được xác thực email. Vui lòng kiểm tra hộp thư và bấm vào link xác thực!", "error");
            }

            showMsg("✅ Đăng nhập thành công! Đang chuyển hướng...", "success");
            setTimeout(() => {
                loadUserProfile(userCredential.user);
            }, 1000);

        } catch (error) {
            console.error(error);
            showMsg("Email hoặc mật khẩu không chính xác!", "error");
        }
    }

    // TẢI HỒ SƠ CÁ NHÂN
    async function loadUserProfile(user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('profileSection').classList.remove('hidden');
        document.getElementById('pEmail').textContent = user.email;

        try {
            const { db, doc, getDoc } = await import('/bx/firebase-init.js');
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                const data = userSnap.data();
                currentUserDoc = data;
                
                document.getElementById('pName').value = data.name || "";
                document.getElementById('pClass').value = data.class || "";

                // Kiểm tra xem Giáo viên có khóa thông tin không
                if (data.infoLocked === true) {
                    document.getElementById('pName').disabled = true;
                    document.getElementById('pClass').disabled = true;
                    document.getElementById('btnSaveProfile').style.display = 'none';
                    document.getElementById('lockMsg').classList.remove('hidden');
                } else {
                    document.getElementById('pName').disabled = false;
                    document.getElementById('pClass').disabled = false;
                    document.getElementById('btnSaveProfile').style.display = 'block';
                    document.getElementById('lockMsg').classList.add('hidden');
                }
            }
        } catch (error) {
            console.error("Lỗi tải hồ sơ:", error);
            alert("Lỗi tải dữ liệu hồ sơ!");
        }
    }

    // CẬP NHẬT HỒ SƠ
    window.handleUpdateProfile = async function() {
        const newName = document.getElementById('pName').value.trim();
        const newClass = document.getElementById('pClass').value.trim().toLowerCase();

        if (!newName || !newClass) return alert("Họ tên và Lớp không được để trống!");

        try {
            const { auth, db, doc, updateDoc } = await import('/bx/firebase-init.js');
            const user = auth.currentUser;
            
            await updateDoc(doc(db, "users", user.uid), {
                name: newName,
                class: newClass,
                updatedAt: new Date()
            });

            alert("✅ Đã lưu thay đổi thông tin cá nhân!");
            currentUserDoc.name = newName;
            currentUserDoc.class = newClass;

        } catch (error) {
            console.error("Lỗi cập nhật:", error);
            alert("Lỗi cập nhật thông tin: " + error.message + "\n(Lưu ý: Có thể Giáo viên vừa khóa tài khoản của bạn)");
        }
    }

    // ĐĂNG XUẤT
    window.handleLogout = async function() {
        const { auth, signOut } = await import('/bx/firebase-init.js');
        await signOut(auth);
        location.reload();
    }
</script>
</body>
</html>
