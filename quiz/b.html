<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản Trị Hệ Thống Thi - Giáo Viên</title>
<script type="module" src="/bx/firebase-init.js"></script>
<style>
    :root { --primary: #004488; --bg: #f4f4f9; --border: #ccc; --success: #28a745; --danger: #d9534f; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    h2 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0;}
    
    /* Tabs */
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 16px; font-weight: bold; color: #666; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form Giao Đề */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; font-size: 15px; }
    .row { display: flex; gap: 15px; }
    .row > .form-group { flex: 1; }
    .checkbox-group { display: flex; gap: 20px; margin-top: 10px; }
    .checkbox-group label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    
    .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s;}
    .btn:hover { opacity: 0.9; }
    .btn-success { background: var(--success); }

    /* Bảng Chấm Điểm */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
    th { background: #f0f0f0; color: var(--primary); font-weight: bold; }
    tr:nth-child(even) { background: #fafafa; }
    
    .score-input { width: 80px; padding: 5px; border: 1px solid var(--primary); border-radius: 4px; font-weight: bold; text-align: center; }
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .status-pending { background: #ffeeba; color: #856404; }
    .status-published { background: #d4edda; color: #155724; }
    
    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loadingScreen" style="text-align: center; margin-top: 50px;">
    <h2>🔄 Đang xác thực quyền Giáo viên...</h2>
</div>

<div id="mainContent" class="container hidden">
    <h2>👨‍🏫 TRANG QUẢN TRỊ GIÁO VIÊN</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tabAssign')">📝 Giao Đề Mới</button>
        <button class="tab-btn" onclick="switchTab('tabGrade')">🎯 Chấm Điểm & Công Bố</button>
    </div>

    <!-- TAB 1: GIAO ĐỀ -->
    <div id="tabAssign" class="tab-content active">
        <div class="form-group">
            <label>Chọn Đề Thi (Từ ngân hàng đề):</label>
            <select id="selectExam" class="form-control">
                <option value="">-- Đang tải danh sách đề --</option>
            </select>
        </div>
        
        <div class="row">
            <div class="form-group">
                <label>Tên hiển thị (VD: Kiểm tra 15p Lý 10):</label>
                <input type="text" id="inputTitle" class="form-control" placeholder="Nhập tên bài thi...">
            </div>
            <div class="form-group">
                <label>Lớp được làm (Cách nhau dấu phẩy):</label>
                <input type="text" id="inputClasses" class="form-control" placeholder="VD: 10a1, 10a2, 10a19">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Thời gian làm bài (Phút):</label>
                <input type="number" id="inputDuration" class="form-control" value="15" min="1">
            </div>
            <div class="form-group">
                <label>Số lần làm tối đa:</label>
                <input type="number" id="inputMaxAttempts" class="form-control" value="1" min="1">
            </div>
        </div>

        <div class="checkbox-group form-group">
            <label><input type="checkbox" id="chkShuffleQ" checked> Đảo thứ tự câu hỏi (theo từng phần)</label>
            <label><input type="checkbox" id="chkShuffleO" checked> Đảo thứ tự đáp án (A, B, C, D)</label>
        </div>

        <button class="btn" onclick="assignExam()" style="width: 100%; padding: 15px; font-size: 18px;">🚀 GIAO BÀI CHO HỌC SINH</button>
    </div>

    <!-- TAB 2: CHẤM ĐIỂM -->
    <div id="tabGrade" class="tab-content">
        <div class="form-group">
            <label>Chọn Đợt Thi Để Chấm:</label>
            <select id="selectAssignment" class="form-control" onchange="loadSubmissions()">
                <option value="">-- Chọn đợt giao bài --</option>
            </select>
        </div>

        <div id="gradeResult">
            <p style="text-align: center; color: #666;">Vui lòng chọn một đợt thi để xem bài nộp.</p>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let allExams = {};
    let allAssignments = {};

    window.addEventListener('load', () => {
        window.checkAuthState((isLoggedIn) => {
            if (!isLoggedIn) {
                document.getElementById('loadingScreen').innerHTML = "<h2 style='color:red;'>❌ Bạn chưa đăng nhập!</h2>";
                return;
            }
            
            // Kiểm tra quyền Giáo viên
            import('/bx/firebase-init.js').then(({ auth }) => {
                currentUser = auth.currentUser;
                if (currentUser.email !== 'trntui6@gmail.com') {
                    document.getElementById('loadingScreen').innerHTML = "<h2 style='color:red;'>⛔ BẠN KHÔNG PHẢI LÀ GIÁO VIÊN!</h2>";
                    return;
                }
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                
                loadExamsForDropdown();
                loadAssignmentsForDropdown();
            });
        });
    });

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // ==========================================
    // CHỨC NĂNG 1: GIAO ĐỀ
    // ==========================================
    async function loadExamsForDropdown() {
        try {
            const { db } = await import('/bx/firebase-init.js');
            const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
            
            const snap = await getDocs(collection(db, "exams"));
            const select = document.getElementById('selectExam');
            select.innerHTML = '<option value="">-- Chọn đề thi --</option>';
            
            snap.forEach(doc => {
                const data = doc.data();
                allExams[doc.id] = data;
                select.innerHTML += `<option value="${doc.id}">${data.title} (Khối ${data.grade})</option>`;
            });
        } catch (error) {
            console.error(error);
            alert("Lỗi tải danh sách đề!");
        }
    }

    window.assignExam = async function() {
        const examId = document.getElementById('selectExam').value;
        const title = document.getElementById('inputTitle').value.trim();
        const classesRaw = document.getElementById('inputClasses').value.trim();
        const duration = parseInt(document.getElementById('inputDuration').value);
        const maxAttempts = parseInt(document.getElementById('inputMaxAttempts').value);
        const shuffleQ = document.getElementById('chkShuffleQ').checked;
        const shuffleO = document.getElementById('chkShuffleO').checked;

        if (!examId || !title || !classesRaw) {
            alert("Vui lòng nhập đầy đủ Tên hiển thị và Lớp!");
            return;
        }

        // Tách chuỗi lớp thành mảng (10a1, 10a2 -> ["10a1", "10a2"])
        const assignedClasses = classesRaw.split(',').map(c => c.trim().toLowerCase()).filter(c => c);

        try {
            const { db } = await import('/bx/firebase-init.js');
            const { collection, addDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

            await addDoc(collection(db, "exam_assignments"), {
                examId: examId,
                title: title,
                assignedClasses: assignedClasses,
                duration: duration,
                maxAttempts: maxAttempts,
                shuffleQuestions: shuffleQ,
                shuffleOptions: shuffleO,
                isOpen: true,
                createdAt: serverTimestamp()
            });

            alert("✅ Đã giao bài thành công!");
            
            // Reset form
            document.getElementById('inputTitle').value = "";
            document.getElementById('inputClasses').value = "";
            
            // Load lại danh sách để chấm điểm
            loadAssignmentsForDropdown();

        } catch (error) {
            console.error(error);
            alert("Lỗi giao bài: " + error.message);
        }
    }

    // ==========================================
    // CHỨC NĂNG 2: CHẤM ĐIỂM
    // ==========================================
    async function loadAssignmentsForDropdown() {
        try {
            const { db } = await import('/bx/firebase-init.js');
            const { collection, getDocs, query, orderBy } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
            
            // Lấy tất cả bài giao
            const snap = await getDocs(collection(db, "exam_assignments"));
            const select = document.getElementById('selectAssignment');
            select.innerHTML = '<option value="">-- Chọn đợt giao bài --</option>';
            
            snap.forEach(doc => {
                const data = doc.data();
                allAssignments[doc.id] = data;
                select.innerHTML += `<option value="${doc.id}">${data.title} (Lớp: ${data.assignedClasses.join(', ')})</option>`;
            });
        } catch (error) {
            console.error(error);
            alert("Lỗi tải danh sách đợt thi!");
        }
    }

    window.loadSubmissions = async function() {
        const assignmentId = document.getElementById('selectAssignment').value;
        const resultDiv = document.getElementById('gradeResult');
        
        if (!assignmentId) {
            resultDiv.innerHTML = "<p style='text-align: center;'>Vui lòng chọn một đợt thi.</p>";
            return;
        }

        resultDiv.innerHTML = "<p style='text-align: center;'>⏳ Đang tải và chấm điểm tự động...</p>";

        try {
            const { db } = await import('/bx/firebase-init.js');
            const { collection, getDocs, query, where, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

            const assignment = allAssignments[assignmentId];
            const examId = assignment.examId;

            // 1. Lấy đáp án gốc (exam_keys)
            const keySnap = await getDoc(doc(db, "exam_keys", examId));
            if (!keySnap.exists()) throw new Error("Không tìm thấy đáp án của đề này!");
            const answerKey = keySnap.data().answers;

            // 2. Lấy danh sách học sinh đã nộp
            const subSnap = await getDocs(query(collection(db, "exam_submissions"), where("assignmentId", "==", assignmentId)));
            
            if (subSnap.empty) {
                resultDiv.innerHTML = "<p style='text-align: center; color: orange;'>Chưa có học sinh nào nộp bài.</p>";
                return;
            }

            // 3. Xử lý chấm điểm
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Email Học Sinh</th>
                            <th>Lượt làm</th>
                            <th>Điểm tự động</th>
                            <th>Điểm chốt (Có thể sửa)</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let index = 1;
            subSnap.forEach(subDoc => {
                const sub = subDoc.data();
                const answers = sub.answers;
                
                // Tính điểm tự động
                let autoScore = 0;
                
                for (const uid in answerKey) {
                    const correctAns = answerKey[uid];
                    const studentAns = answers[uid];

                    if (studentAns === undefined || studentAns === null || studentAns === "") continue;

                    // Chấm Phần I (Trắc nghiệm)
                    if (typeof correctAns === 'number' && !Array.isArray(correctAns)) {
                        // Nếu uid bắt đầu bằng p3 (Trả lời ngắn) -> so sánh số
                        if (uid.startsWith('p3')) {
                            if (parseFloat(studentAns) === correctAns) autoScore += 0.5;
                        } 
                        // Nếu là p1 (Trắc nghiệm A,B,C,D) -> so sánh index
                        else {
                            if (parseInt(studentAns) === correctAns) autoScore += 0.25;
                        }
                    } 
                    // Chấm Phần II (Đúng/Sai)
                    else if (Array.isArray(correctAns)) {
                        let correctCount = 0;
                        for (let i = 0; i < 4; i++) {
                            if (studentAns[i] === correctAns[i]) correctCount++;
                        }
                        // Quy chế chấm điểm Đúng/Sai (4 đúng=1đ, 3 đúng=0.5đ, 2 đúng=0.25đ, 1 đúng=0.1đ)
                        if (correctCount === 4) autoScore += 1.0;
                        else if (correctCount === 3) autoScore += 0.5;
                        else if (correctCount === 2) autoScore += 0.25;
                        else if (correctCount === 1) autoScore += 0.1;
                    }
                }

                const displayScore = sub.score !== null ? sub.score : autoScore;
                const isPublished = sub.isPublished;
                const statusHtml = isPublished 
                    ? `<span class="status-badge status-published">Đã công bố</span>` 
                    : `<span class="status-badge status-pending">Chờ duyệt</span>`;

                html += `
                    <tr id="row-${subDoc.id}">
                        <td>${sub.studentEmail}</td>
                        <td>Lượt ${index++}</td>
                        <td style="color: #004488; font-weight: bold;">${autoScore.toFixed(2)}</td>
                        <td>
                            <input type="number" step="0.05" class="score-input" id="score-${subDoc.id}" value="${displayScore.toFixed(2)}" ${isPublished ? 'disabled' : ''}>
                        </td>
                        <td>${statusHtml}</td>
                        <td>
                            ${!isPublished ? `<button class="btn btn-success" style="padding: 5px 10px; font-size: 13px;" onclick="publishScore('${subDoc.id}')">Công bố</button>` : 'Đã xong'}
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            resultDiv.innerHTML = html;

        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = `<p style='color: red; text-align: center;'>Lỗi chấm điểm: ${error.message}</p>`;
        }
    }

    window.publishScore = async function(subId) {
        const scoreVal = document.getElementById(`score-${subId}`).value;
        const finalScore = parseFloat(scoreVal);

        if (isNaN(finalScore)) {
            alert("Điểm không hợp lệ!");
            return;
        }

        if (!confirm("Bạn có chắc chắn muốn công bố điểm này cho Học sinh? (Không thể sửa sau khi công bố)")) return;

        try {
            const { db } = await import('/bx/firebase-init.js');
            const { doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

            await updateDoc(doc(db, "exam_submissions", subId), {
                score: finalScore,
                isPublished: true
            });

            alert("✅ Đã công bố điểm thành công!");
            loadSubmissions(); // Load lại bảng để cập nhật giao diện

        } catch (error) {
            console.error(error);
            alert("Lỗi công bố điểm: " + error.message);
        }
    }
</script>
</body>
</html>
