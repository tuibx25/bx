<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản Trị Hệ Thống Thi - Giáo Viên</title>
<!-- Thư viện xuất Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="/bx/firebase-init.js"></script>

<style>
    :root { --primary: #004488; --bg: #f4f4f9; --border: #ccc; --success: #28a745; --danger: #d9534f; --warning: #ffc107; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0; }
    
    /* Tabs */
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 12px 24px; cursor: pointer; border: none; background: none; font-size: 15px; font-weight: bold; color: #666; transition: 0.2s; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #f0f4f8; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form & Input */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    .row { display: flex; gap: 15px; flex-wrap: wrap; }
    .row > .form-group { flex: 1; min-width: 200px; }
    .checkbox-group { display: flex; gap: 20px; margin-top: 10px; }
    .checkbox-group label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    
    /* Buttons */
    .btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--warning); color: #333; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

    /* Tables */
    .table-wrap { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 14px; }
    th { background: #e9ecef; color: var(--primary); font-weight: bold; position: sticky; top: 0; }
    tr:nth-child(even) { background: #fafafa; }
    tr:hover { background: #f1f1f1; }
    
    .score-input { width: 70px; padding: 5px; border: 1px solid var(--primary); border-radius: 4px; font-weight: bold; text-align: center; }
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap; }
    .status-pending { background: #ffeeba; color: #856404; }
    .status-published { background: #d4edda; color: #155724; }
    
    /* Search Bar */
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 5px;}
    .search-bar input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

    /* Modal Xem chi tiết bài làm */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; overflow-y: auto; padding: 20px;}
    .modal-content { background: #fff; max-width: 800px; margin: 40px auto; padding: 20px; border-radius: 10px; }
    .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-close { cursor: pointer; font-size: 24px; font-weight: bold; color: red; }
    
    .q-detail { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    .ans-correct { color: #155724; font-weight: bold; }
    .ans-wrong { color: #721c24; font-weight: bold; text-decoration: line-through; }
    .ans-neutral { color: #555; }

    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loadingScreen" style="text-align: center; margin-top: 50px;">
    <h2>🔄 Đang xác thực quyền Giáo viên...</h2>
</div>

<div id="mainContent" class="container hidden">
    <h2>👨‍🏫 TRANG QUẢN TRỊ GIÁO VIÊN</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tabManageAssign')">📝 Quản lý Giao Đề</button>
        <button class="tab-btn" onclick="switchTab('tabGrade')">🎯 Chấm Điểm & Chi Tiết</button>
        <button class="tab-btn" onclick="switchTab('tabGradebook')">📊 Sổ Điểm Lớp</button>
    </div>

    <!-- ========================================== -->
    <!-- TAB 1: QUẢN LÝ GIAO ĐỀ & TÌM KIẾM ĐỀ -->
    <!-- ========================================== -->
    <div id="tabManageAssign" class="tab-content active">
        <div style="background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0; color: var(--primary);">Tạo Đợt Giao Bài Mới</h3>
            <div class="row">
                <div class="form-group">
                    <label>Chọn Đề Thi (Từ ngân hàng):</label>
                    <select id="selectExam" class="form-control"><option value="">-- Tải danh sách --</option></select>
                </div>
                <div class="form-group">
                    <label>Tên hiển thị:</label>
                    <input type="text" id="inputTitle" class="form-control" placeholder="VD: Kiểm tra 15p Lý 10">
                </div>
                <div class="form-group">
                    <label>Lớp được làm (Cách nhau dấu phẩy):</label>
                    <input type="text" id="inputClasses" class="form-control" placeholder="VD: 10a1, 10a19">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Thời gian (Phút):</label>
                    <input type="number" id="inputDuration" class="form-control" value="15" min="1">
                </div>
                <div class="form-group">
                    <label>Số lần làm tối đa:</label>
                    <input type="number" id="inputMaxAttempts" class="form-control" value="1" min="1">
                </div>
                <div class="form-group">
                    <div class="checkbox-group" style="margin-top: 25px;">
                        <label><input type="checkbox" id="chkShuffleQ" checked> Đảo câu hỏi</label>
                        <label><input type="checkbox" id="chkShuffleO" checked> Đảo đáp án</label>
                    </div>
                </div>
            </div>
            <button class="btn btn-success" onclick="assignExam()" style="width: 100%; padding: 12px; font-size: 16px;">🚀 GIAO BÀI</button>
        </div>

        <h3>Danh Sách Các Đợt Giao Bài</h3>
        <div class="search-bar">
            <input type="text" id="searchAssign" placeholder="🔍 Tìm kiếm theo tên bài hoặc lớp..." oninput="renderAssignments()">
        </div>
        <div class="table-wrap" id="assignmentList"></div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 2: CHẤM ĐIỂM & XEM CHI TIẾT -->
    <!-- ========================================== -->
    <div id="tabGrade" class="tab-content">
        <div class="form-group">
            <label>Chọn Đợt Thi Để Chấm:</label>
            <select id="selectAssignment" class="form-control" onchange="loadSubmissions()">
                <option value="">-- Chọn đợt giao bài --</option>
            </select>
        </div>

        <div id="gradeResult">
            <p style="text-align: center; color: #666;">Vui lòng chọn một đợt thi để xem bài nộp.</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 3: SỔ ĐIỂM LỚP & XUẤT EXCEL -->
    <!-- ========================================== -->
    <div id="tabGradebook" class="tab-content">
        <div class="row" style="align-items: flex-end;">
            <div class="form-group" style="max-width: 300px;">
                <label>Chọn Lớp:</label>
                <input type="text" id="inputClassGradebook" class="form-control" placeholder="Nhập lớp (VD: 10a1)" oninput="loadGradebook()">
            </div>
            <div class="form-group">
                <button class="btn btn-outline" onclick="exportExcel()">📥 Xuất File Excel</button>
            </div>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchStudent" placeholder="🔍 Tìm tên hoặc email học sinh..." oninput="filterGradebook()">
        </div>
        <div class="table-wrap" id="gradebookResult">
            <p style="text-align: center;">Vui lòng nhập tên lớp để tải sổ điểm.</p>
        </div>
    </div>
</div>

<!-- MODAL XEM CHI TIẾT BÀI LÀM -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin: 0; color: var(--primary);">Chi tiết bài làm</h3>
            <span class="modal-close" onclick="closeModal()">×</span>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    let currentUser = null;
    let allExams = {};
    let allAssignments = {};
    let allStudents = [];
    let allGradebookData = [];

    window.addEventListener('load', () => {
        window.checkAuthState((isLoggedIn) => {
            if (!isLoggedIn) return;
            import('/bx/firebase-init.js').then(({ auth }) => {
                currentUser = auth.currentUser;
                if (currentUser.email !== 'trntui6@gmail.com') {
                    document.getElementById('loadingScreen').innerHTML = "<h2 style='color:red;'>⛔ BẠN KHÔNG PHẢI LÀ GIÁO VIÊN!</h2>";
                    return;
                }
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                loadExamsForDropdown();
                loadAssignmentsData();
            });
        });
    });

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // ==========================================
    // TAB 1: QUẢN LÝ ĐỀ GIAO
    // ==========================================
    async function loadExamsForDropdown() {
        const { db } = await import('/bx/firebase-init.js');
        const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        const snap = await getDocs(collection(db, "exams"));
        const select = document.getElementById('selectExam');
        select.innerHTML = '<option value="">-- Chọn đề thi --</option>';
        snap.forEach(doc => {
            const data = doc.data();
            allExams[doc.id] = data;
            select.innerHTML += `<option value="${doc.id}">${data.title} (Khối ${data.grade})</option>`;
        });
    }

    window.assignExam = async function() {
        const examId = document.getElementById('selectExam').value;
        const title = document.getElementById('inputTitle').value.trim();
        const classesRaw = document.getElementById('inputClasses').value.trim();
        const duration = parseInt(document.getElementById('inputDuration').value);
        const maxAttempts = parseInt(document.getElementById('inputMaxAttempts').value);
        const shuffleQ = document.getElementById('chkShuffleQ').checked;
        const shuffleO = document.getElementById('chkShuffleO').checked;

        if (!examId || !title || !classesRaw) return alert("Vui lòng nhập đủ thông tin!");
        const assignedClasses = classesRaw.split(',').map(c => c.trim().toLowerCase()).filter(c => c);

        const { db } = await import('/bx/firebase-init.js');
        const { collection, addDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        
        await addDoc(collection(db, "exam_assignments"), {
            examId, title, assignedClasses, duration, maxAttempts,
            shuffleQuestions: shuffleQ, shuffleOptions: shuffleO,
            isOpen: true, createdAt: serverTimestamp()
        });

        alert("✅ Đã giao bài thành công!");
        document.getElementById('inputTitle').value = "";
        document.getElementById('inputClasses').value = "";
        loadAssignmentsData();
    }

    async function loadAssignmentsData() {
        const { db } = await import('/bx/firebase-init.js');
        const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        const snap = await getDocs(collection(db, "exam_assignments"));
        
        allAssignments = {};
        const select = document.getElementById('selectAssignment');
        select.innerHTML = '<option value="">-- Chọn đợt giao bài --</option>';

        snap.forEach(doc => {
            allAssignments[doc.id] = doc.data();
            select.innerHTML += `<option value="${doc.id}">${doc.data().title} (Lớp: ${doc.data().assignedClasses.join(', ')})</option>`;
        });
        
        renderAssignments();
    }

    window.renderAssignments = function() {
        const keyword = document.getElementById('searchAssign').value.toLowerCase();
        const tbody = document.getElementById('assignmentList');
        let html = `<table><thead><tr>
            <th>Tên Bài</th><th>Lớp</th><th>Thời gian</th><th>Lượt</th><th>Trạng thái</th><th>Hành động</th>
        </tr></thead><tbody>`;

        for (const id in allAssignments) {
            const a = allAssignments[id];
            const textMatch = a.title.toLowerCase().includes(keyword) || a.assignedClasses.join(',').toLowerCase().includes(keyword);
            if (!textMatch) continue;

            const status = a.isOpen 
                ? '<span class="status-badge status-published">Đang mở</span>' 
                : '<span class="status-badge status-pending">Đã ẩn</span>';

            html += `<tr>
                <td><b>${a.title}</b></td>
                <td>${a.assignedClasses.join(', ')}</td>
                <td>${a.duration} phút</td>
                <td>${a.maxAttempts} lần</td>
                <td>${status}</td>
                <td>
                    <button class="btn btn-sm ${a.isOpen ? 'btn-warning' : 'btn-success'}" onclick="toggleAssign('${id}', ${a.isOpen})">${a.isOpen ? 'Ẩn đề' : 'Hiện đề'}</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteAssign('${id}')">Xóa</button>
                </td>
            </tr>`;
        }
        html += `</tbody></table>`;
        tbody.innerHTML = html;
    }

    window.toggleAssign = async function(id, currentStatus) {
        const { db } = await import('/bx/firebase-init.js');
        const { doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        await updateDoc(doc(db, "exam_assignments", id), { isOpen: !currentStatus });
        loadAssignmentsData();
    }

    window.deleteAssign = async function(id) {
        if(!confirm("Bạn có chắc muốn xóa đợt giao bài này? Học sinh sẽ không thấy đề này nữa, nhưng điểm đã chấm vẫn được lưu trong Sổ Điểm.")) return;
        const { db } = await import('/bx/firebase-init.js');
        const { doc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        await deleteDoc(doc(db, "exam_assignments", id));
        loadAssignmentsData();
    }

    // ==========================================
    // TAB 2: CHẤM ĐIỂM & CHI TIẾT
    // ==========================================
    window.loadSubmissions = async function() {
        const assignmentId = document.getElementById('selectAssignment').value;
        const resultDiv = document.getElementById('gradeResult');
        if (!assignmentId) return resultDiv.innerHTML = "<p>Vui lòng chọn đợt thi.</p>";

        resultDiv.innerHTML = "<p>⏳ Đang tải...</p>";
        const { db } = await import('/bx/firebase-init.js');
        const { collection, getDocs, query, where, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

        const assignment = allAssignments[assignmentId];
        const keySnap = await getDoc(doc(db, "exam_keys", assignment.examId));
        const answerKey = keySnap.data().answers;

        const subSnap = await getDocs(query(collection(db, "exam_submissions"), where("assignmentId", "==", assignmentId)));
        if (subSnap.empty) return resultDiv.innerHTML = "<p style='color: orange;'>Chưa có học sinh nào nộp bài.</p>";

        let html = `<table><thead><tr>
            <th>Email</th><th>Điểm tự động</th><th>Điểm chốt</th><th>Trạng thái</th><th>Hành động</th>
        </tr></thead><tbody>`;

        subSnap.forEach(subDoc => {
            const sub = subDoc.data();
            const autoScore = calculateScore(sub.answers, answerKey);
            const displayScore = sub.score !== null ? sub.score : autoScore;
            const status = sub.isPublished ? '<span class="status-badge status-published">Đã công bố</span>' : '<span class="status-badge status-pending">Chờ duyệt</span>';

            html += `<tr>
                <td>${sub.studentEmail}</td>
                <td style="color: var(--primary); font-weight: bold;">${autoScore.toFixed(2)}</td>
                <td><input type="number" step="0.05" class="score-input" id="score-${subDoc.id}" value="${displayScore.toFixed(2)}" ${sub.isPublished ? 'disabled' : ''}></td>
                <td>${status}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick="viewDetail('${subDoc.id}', '${assignmentId}')">Xem chi tiết</button>
                    ${!sub.isPublished ? `<button class="btn btn-sm btn-success" onclick="publishScore('${subDoc.id}')">Công bố</button>` : ''}
                </td>
            </tr>`;
        });
        resultDiv.innerHTML = html + `</tbody></table>`;
    }

    function calculateScore(answers, answerKey) {
        let score = 0;
        for (const uid in answerKey) {
            const correct = answerKey[uid];
            const studentAns = answers[uid];
            if (studentAns === undefined || studentAns === null || studentAns === "") continue;

            if (typeof correct === 'number' && !Array.isArray(correct)) {
                if (uid.startsWith('p3')) { if (parseFloat(studentAns) === correct) score += 0.5; } 
                else { if (parseInt(studentAns) === correct) score += 0.25; }
            } else if (Array.isArray(correct)) {
                let count = 0;
                for (let i = 0; i < 4; i++) if (studentAns[i] === correct[i]) count++;
                if (count === 4) score += 1.0; else if (count === 3) score += 0.5;
                else if (count === 2) score += 0.25; else if (count === 1) score += 0.1;
            }
        }
        return score;
    }

    window.viewDetail = async function(subId, assignmentId) {
        document.getElementById('detailModal').style.display = 'block';
        document.getElementById('modalBody').innerHTML = "<p>⏳ Đang tải chi tiết...</p>";
        
        const { db } = await import('/bx/firebase-init.js');
        const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        
        const assignment = allAssignments[assignmentId];
        const examSnap = await getDoc(doc(db, "exams", assignment.examId));
        const keySnap = await getDoc(doc(db, "exam_keys", assignment.examId));
        const subSnap = await getDoc(doc(db, "exam_submissions", subId));

        const examData = examSnap.data();
        const answerKey = keySnap.data().answers;
        const subData = subSnap.data();

        let html = `<p><b>Học sinh:</b> ${subData.studentEmail}</p>`;
        
        examData.questions.forEach((q, idx) => {
            const correctAns = answerKey[q.uid];
            const studentAns = subData.answers[q.uid];
            html += `<div class="q-detail">
                <p><b>Câu ${idx + 1}:</b> ${q.text}</p>`;
            
            if (q.part === 1) {
                q.options.forEach((opt, oIdx) => {
                    // Xử lý nếu đề bị đảo đáp án (opt là object)
                    const isShuffled = typeof opt === 'object';
                    const origIdx = isShuffled ? opt.originalIndex : oIdx;
                    const text = isShuffled ? opt.text : opt;
                    
                    let cls = "ans-neutral";
                    if (origIdx === correctAns) cls = "ans-correct";
                    else if (origIdx === studentAns) cls = "ans-wrong";
                    
                    html += `<div class="${cls}">${String.fromCharCode(65 + oIdx)}. ${text} ${origIdx === studentAns ? '(Đã chọn)' : ''}</div>`;
                });
            } else if (q.part === 2) {
                q.statements.forEach((st, sIdx) => {
                    const stAns = studentAns ? studentAns[sIdx] : "";
                    const isCorrect = stAns === correctAns[sIdx];
                    html += `<div class="${isCorrect ? 'ans-correct' : 'ans-wrong'}">${String.fromCharCode(97 + sIdx)}) ${st} - HS chọn: ${stAns || 'Trống'} (Đáp án: ${correctAns[sIdx]})</div>`;
                });
            } else if (q.part === 3) {
                const isCorrect = parseFloat(studentAns) === correctAns;
                html += `<div class="${isCorrect ? 'ans-correct' : 'ans-wrong'}">HS trả lời: ${studentAns || 'Trống'} (Đáp án: ${correctAns})</div>`;
            }
            html += `</div>`;
        });
        
        document.getElementById('modalBody').innerHTML = html;
    }

    window.closeModal = function() { document.getElementById('detailModal').style.display = 'none'; }

    window.publishScore = async function(subId) {
        const finalScore = parseFloat(document.getElementById(`score-${subId}`).value);
        if (isNaN(finalScore)) return alert("Điểm không hợp lệ!");
        if (!confirm("Công bố điểm này cho Học sinh?")) return;

        const { db } = await import('/bx/firebase-init.js');
        const { doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        await updateDoc(doc(db, "exam_submissions", subId), { score: finalScore, isPublished: true });
        loadSubmissions();
    }

    // ==========================================
    // TAB 3: SỔ ĐIỂM LỚP & XUẤT EXCEL
    // ==========================================
    window.loadGradebook = async function() {
        const className = document.getElementById('inputClassGradebook').value.trim().toLowerCase();
        if (!className) return;
        
        const resultDiv = document.getElementById('gradebookResult');
        resultDiv.innerHTML = "<p>⏳ Đang tải sổ điểm...</p>";

        const { db } = await import('/bx/firebase-init.js');
        const { collection, getDocs, query, where } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

        // 1. Lấy danh sách HS
        const userSnap = await getDocs(query(collection(db, "users"), where("class", "==", className)));
        allStudents = [];
        userSnap.forEach(d => {
            const u = d.data();
            allStudents.push({ id: d.id, email: u.email, name: u.name || "Chưa đặt tên", role: u.role });
        });

        // 2. Lấy tất cả bài giao của lớp này
        const assignSnap = await getDocs(collection(db, "exam_assignments"));
        let classAssignments = [];
        assignSnap.forEach(d => {
            const a = d.data();
            if (a.assignedClasses.includes(className)) {
                classAssignments.push({ id: d.id, ...a });
            }
        });

        // 3. Lấy tất cả bài nộp của lớp này
        const subSnap = await getDocs(query(collection(db, "exam_submissions"), where("assignmentId", "in", classAssignments.map(a=>a.id).slice(0, 10)))); // Giới hạn 10 đề do Firestore giới hạn
        const submissions = subSnap.docs.map(d => d.data());

        // 4. Tổng hợp dữ liệu
        allGradebookData = allStudents.map(st => {
            let row = { email: st.email, name: st.name, total: "Chưa thi" };
            let maxScore = -1;
            
            classAssignments.forEach(a => {
                const subs = submissions.filter(s => s.studentId === st.id && s.assignmentId === a.id);
                const scores = subs.map(s => s.score).filter(s => s !== null && s !== undefined);
                const best = scores.length > 0 ? Math.max(...scores) : null;
                row[a.id] = best !== null ? best : "";
                if (best !== null && best > maxScore) maxScore = best;
            });

            row.total = maxScore >= 0 ? maxScore : "Chưa thi";
            return row;
        });

        renderGradebook();
    }

    function renderGradebook() {
        const resultDiv = document.getElementById('gradebookResult');
        if (allGradebookData.length === 0) return resultDiv.innerHTML = "<p>Không có học sinh nào.</p>";

        let html = `<table id="excelTable"><thead><tr>
            <th>Họ Tên</th><th>Email</th>`;
        
        // Tên các cột (Tên đề)
        const assignIds = Object.keys(allGradebookData[0]).filter(k => k !== 'email' && k !== 'name' && k !== 'total');
        assignIds.forEach(id => {
            const a = allAssignments[id];
            if(a) html += `<th>${a.title}</th>`;
        });
        html += `<th style="background: #d4edda; color: #155724;">Điểm Cao Nhất</th></tr></thead><tbody>`;

        allGradebookData.forEach((row, idx) => {
            html += `<tr class="data-row">
                <td><input type="text" value="${row.name}" onchange="updateStudentName('${row.email}', this.value)" style="border: none; border-bottom: 1px dashed #ccc; width: 100%;"></td>
                <td>${row.email}</td>`;
            assignIds.forEach(id => {
                const score = row[id];
                const color = score !== "" ? 'color: green; font-weight: bold;' : 'color: #ccc;';
                html += `<td style="${color}">${score}</td>`;
            });
            html += `<td style="background: #d4edda; font-weight: bold;">${row.total}</td></tr>`;
        });
        resultDiv.innerHTML = html + `</tbody></table>`;
    }

    window.filterGradebook = function() {
        const keyword = document.getElementById('searchStudent').value.toLowerCase();
        const rows = document.querySelectorAll('.data-row');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(keyword) ? '' : 'none';
        });
    }

    window.updateStudentName = async function(email, newName) {
        const { db } = await import('/bx/firebase-init.js');
        const { collection, query, where, getDocs, doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        const snap = await getDocs(query(collection(db, "users"), where("email", "==", email)));
        if (!snap.empty) {
            await updateDoc(doc(db, "users", snap.docs[0].id), { name: newName });
        }
    }

    window.exportExcel = function() {
        if (allGradebookData.length === 0) return alert("Không có dữ liệu để xuất!");
        const table = document.getElementById("excelTable");
        const wb = XLSX.utils.table_to_book(table, {sheet: "Diem"});
        XLSX.writeFile(wb, "So_Diem.xlsx");
    }
</script>
</body>
