<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Board</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            transition: background-color 0.15s ease;
        }

        body.gray-bg { background: #e8e8e8; }

        #board {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            transition: background-color 0.15s ease;
        }

        body.gray-bg #board { background: #e8e8e8; }

        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            touch-action: none;
        }

        #drawCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        #drawCanvas.eraser { cursor: cell; }

        /* ============ ẢNH ============ */
        .img-wrapper {
            position: absolute;
            z-index: 50;
            display: inline-block;
            line-height: 0;
        }

        .img-wrapper.selected {
            outline: 2px dashed #0066CC;
            outline-offset: 2px;
        }

        .img-wrapper img {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #0066CC;
            border: 2px solid #fff;
            border-radius: 50%;
            z-index: 200;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            display: none;
        }

        .resize-handle.nw { cursor: nwse-resize; top: -6px; left: -6px; }
        .resize-handle.ne { cursor: nesw-resize; top: -6px; right: -6px; }
        .resize-handle.sw { cursor: nesw-resize; bottom: -6px; left: -6px; }
        .resize-handle.se { cursor: nwse-resize; bottom: -6px; right: -6px; }
        .resize-handle.n  { cursor: ns-resize; top: -6px; left: 50%; transform: translateX(-50%); }
        .resize-handle.s  { cursor: ns-resize; bottom: -6px; left: 50%; transform: translateX(-50%); }
        .resize-handle.w  { cursor: ew-resize; top: 50%; left: -6px; transform: translateY(-50%); }
        .resize-handle.e  { cursor: ew-resize; top: 50%; right: -6px; transform: translateY(-50%); }

        .img-wrapper.selected .resize-handle { display: block; }

        .img-wrapper .img-delete {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: #d33;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 210;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .img-wrapper.selected .img-delete { display: block; }
        .img-wrapper .img-delete:hover { background: #b00; }

        body.drawing-mode .img-wrapper { pointer-events: none; }

        /* ============ TEXTBOX ============ */
        .textbox {
            position: absolute;
            min-width: 120px;
            min-height: 30px;
            max-width: 80vw;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px dashed #8B4513;
            color: #000000;
            font-size: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            font-weight: bold;
            z-index: 150;
            outline: none;
            cursor: move;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .textbox:focus {
            border-style: solid;
            border-color: #0066CC;
            background: rgba(255, 255, 255, 0.95);
            cursor: text;
        }

        .textbox.editing { cursor: text; }

        /* Text content riêng để không phá nút con */
        .textbox .tb-content {
            display: inline-block;
            min-width: 40px;
            outline: none;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* Placeholder cho textbox trống */
        .textbox .tb-content.placeholder {
            color: #999;
            font-weight: normal;
            font-style: italic;
        }

        .textbox .tb-delete {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: #d33;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 220;
        }

        .textbox:hover .tb-delete,
        .textbox.mic-active .tb-delete,
        .textbox.editing .tb-delete { display: block; }

        body.gray-bg .textbox { background: rgba(255, 255, 255, 0.9); }

        /* ============ TEXTBOX RESIZE HANDLES ============ */
        .textbox .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #0066CC;
            border: 2px solid #fff;
            border-radius: 50%;
            z-index: 200;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            display: none;
        }

        .textbox .resize-handle.nw { cursor: nwse-resize; top: -5px; left: -5px; }
        .textbox .resize-handle.ne { cursor: nesw-resize; top: -5px; right: -5px; }
        .textbox .resize-handle.sw { cursor: nesw-resize; bottom: -5px; left: -5px; }
        .textbox .resize-handle.se { cursor: nwse-resize; bottom: -5px; right: -5px; }
        .textbox .resize-handle.n  { cursor: ns-resize; top: -5px; left: 50%; transform: translateX(-50%); }
        .textbox .resize-handle.s  { cursor: ns-resize; bottom: -5px; left: 50%; transform: translateX(-50%); }
        .textbox .resize-handle.w  { cursor: ew-resize; top: 50%; left: -5px; transform: translateY(-50%); }
        .textbox .resize-handle.e  { cursor: ew-resize; top: 50%; right: -5px; transform: translateY(-50%); }

        .textbox:hover .resize-handle,
        .textbox.editing .resize-handle,
        .textbox.selected .resize-handle { display: block; }

        /* ============ MIC BUTTON (Speech-to-Text) ============ */
        .tb-mic {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 26px;
            height: 26px;
            background: #0066CC;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 26px;
            font-size: 14px;
            cursor: pointer;
            display: none;
            z-index: 220;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: background 0.15s, transform 0.15s;
            user-select: none;
        }

        .tb-mic:hover { background: #0055aa; transform: scale(1.1); }
        .tb-mic.listening {
            background: #d33;
            animation: pulse-mic 1s infinite;
        }

        @keyframes pulse-mic {
            0%   { box-shadow: 0 0 0 0 rgba(211, 51, 51, 0.7); }
            70%  { box-shadow: 0 0 0 10px rgba(211, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 51, 51, 0); }
        }

        .textbox:hover .tb-mic,
        .textbox.editing .tb-mic,
        .textbox.mic-active .tb-mic { display: block; }

        /* ============ CONTEXT MENU ============ */
        #ctxMenu {
            position: fixed;
            z-index: 10000;
            background: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            border-radius: 8px;
            padding: 12px 14px;
            min-width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #333;
            display: none;
            user-select: none;
        }

        #ctxMenu .ctx-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        #ctxMenu .ctx-row:last-child { margin-bottom: 0; }

        #ctxMenu label {
            flex: 0 0 80px;
            font-size: 12px;
            color: #555;
        }

        #ctxMenu select,
        #ctxMenu input[type="number"],
        #ctxMenu input[type="color"],
        #ctxMenu input[type="text"] {
            flex: 1;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            min-width: 0;
        }

        #ctxMenu input[type="color"] {
            padding: 2px;
            height: 30px;
            cursor: pointer;
        }

        #ctxMenu input[type="range"] {
            flex: 1;
            cursor: pointer;
        }

        #ctxMenu select:focus,
        #ctxMenu input:focus { border-color: #0066CC; }

        #ctxMenu .ctx-title {
            font-weight: bold;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
        }

        #ctxMenu .ctx-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        #ctxMenu .ctx-btn {
            flex: 1;
            padding: 7px 10px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        #ctxMenu .ctx-btn-apply { background: #0066CC; color: #fff; }
        #ctxMenu .ctx-btn-apply:hover { background: #0055aa; }
        #ctxMenu .ctx-btn-reset { background: #eee; color: #333; }
        #ctxMenu .ctx-btn-reset:hover { background: #ddd; }
        #ctxMenu .ctx-btn-danger { background: #d33; color: #fff; }
        #ctxMenu .ctx-btn-danger:hover { background: #b00; }

        #ctxMenu .ctx-checks {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        #ctxMenu .ctx-check {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
        }

        #ctxMenu .ctx-check input { cursor: pointer; margin: 0; }

        #ctxMenu .ctx-radios {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        #ctxMenu .ctx-radio {
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fafafa;
            user-select: none;
        }

        #ctxMenu .ctx-radio input { cursor: pointer; margin: 0; }

        #ctxMenu .ctx-radio.active {
            background: #0066CC;
            color: #fff;
            border-color: #0066CC;
        }

        #ctxMenu .ctx-radio.active input { accent-color: #fff; }

        .color-swatches {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: #888;
        }

        .color-swatch.active {
            border-color: #0066CC;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.3);
        }

        .color-swatch.active::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .color-swatch.light.active::after {
            color: #333;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        ::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
        html { scrollbar-width: none; }
        body { -ms-overflow-style: none; }

        #watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 60px;
            color: rgba(0, 0, 0, 0.03);
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            font-weight: bold;
            letter-spacing: 10px;
        }

        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="watermark">BX</div>

    <div id="board">
        <canvas id="drawCanvas"></canvas>
    </div>

    <div id="ctxMenu">

        <div id="ctxDraw">
            <div class="ctx-title">🖌️ Công cụ vẽ</div>

            <div class="ctx-row">
                <label>Màu vẽ</label>
                <div class="color-swatches" id="drawColorSwatches">
                    <div class="color-swatch" data-color="#000000" style="background:#000000" title="Đen"></div>
                    <div class="color-swatch active" data-color="#8B4513" style="background:#8B4513" title="Nâu (mặc định)"></div>
                    <div class="color-swatch" data-color="#FF0000" style="background:#FF0000" title="Đỏ"></div>
                    <div class="color-swatch light" data-color="#F5F5DC" style="background:#F5F5DC" title="Be"></div>
                    <div class="color-swatch light" data-color="#F5DEB3" style="background:#F5DEB3" title="Lúa mì"></div>
                    <div class="color-swatch light" data-color="#D3D3D3" style="background:#D3D3D3" title="Xám nhạt"></div>
                    <div class="color-swatch" data-color="#0066CC" style="background:#0066CC" title="Xanh"></div>
                    <div class="color-swatch" data-color="#004488" style="background:#004488" title="Xanh đậm"></div>
                </div>
            </div>

            <div class="ctx-row">
                <label>Màu khác</label>
                <input type="color" id="drawCustomColor" value="#8B4513">
            </div>

            <div class="ctx-row">
                <label>Độ dày</label>
                <input type="range" id="drawWidth" min="1" max="30" step="1" value="2">
                <span id="drawWidthVal" style="flex:0 0 40px;text-align:right;font-size:12px;color:#555;">2px</span>
            </div>

            <div class="ctx-row">
                <label class="ctx-check" style="flex:0 0 100%;">
                    <input type="checkbox" id="drawPressure" checked> Nhạy lực nhấn bút (pressure)
                </label>
            </div>

            <div class="ctx-row">
                <label>Chế độ</label>
                <div class="ctx-radios" id="drawModeGroup">
                    <label class="ctx-radio active" data-mode="pen"><input type="radio" name="drawMode" value="pen" checked>✏️ Bút</label>
                    <label class="ctx-radio" data-mode="eraser"><input type="radio" name="drawMode" value="eraser">🧽 Tẩy</label>
                </div>
            </div>

            <div class="ctx-row ctx-section" style="margin-bottom:0;">
                <button class="ctx-btn ctx-btn-reset" id="drawClearAll" style="background:#d33;color:#fff;">Xoá hết nét vẽ</button>
            </div>
        </div>

        <div id="ctxTextBox" style="display:none;">
            <div class="ctx-title">📝 Định dạng chữ</div>

            <div class="ctx-row">
                <label>Font</label>
                <select id="ctxFont">
                    <option value="Segoe UI">Segoe UI</option>
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Tahoma">Tahoma</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                    <option value="Comic Sans MS">Comic Sans MS</option>
                    <option value="Impact">Impact</option>
                    <option value="Roboto">Roboto</option>
                </select>
            </div>

            <div class="ctx-row">
                <label>Cỡ chữ</label>
                <input type="number" id="ctxSize" min="8" max="200" step="1" value="24">
            </div>

            <div class="ctx-row">
                <label>Màu chữ</label>
                <input type="color" id="ctxColor" value="#000000">
            </div>

            <div class="ctx-row">
                <label>Kiểu chữ</label>
                <div class="ctx-checks">
                    <label class="ctx-check"><input type="checkbox" id="ctxBold" checked><b>B</b></label>
                    <label class="ctx-check"><input type="checkbox" id="ctxItalic"><i>I</i></label>
                    <label class="ctx-check"><input type="checkbox" id="ctxUnderline"><u>U</u></label>
                </div>
            </div>

            <div class="ctx-row">
                <label>Căn lề</label>
                <div class="ctx-radios" id="ctxAlignGroup">
                    <label class="ctx-radio" data-align="left"><input type="radio" name="ctxAlign" value="left" checked>Trái</label>
                    <label class="ctx-radio" data-align="center"><input type="radio" name="ctxAlign" value="center">Giữa</label>
                    <label class="ctx-radio" data-align="right"><input type="radio" name="ctxAlign" value="right">Phải</label>
                    <label class="ctx-radio" data-align="justify"><input type="radio" name="ctxAlign" value="justify">Đều</label>
                </div>
            </div>

            <div class="ctx-section">
                <div class="ctx-title" style="margin-bottom:6px;">📦 Hộp textbox</div>

                <div class="ctx-row">
                    <label>Nền</label>
                    <input type="color" id="ctxBg" value="#ffffff">
                    <label class="ctx-check" style="flex:0 0 auto;"><input type="checkbox" id="ctxBgTransparent"> Trong suốt</label>
                </div>

                <div class="ctx-row">
                    <label>Viền</label>
                    <input type="color" id="ctxBorder" value="#8B4513">
                    <select id="ctxBorderStyle" style="flex:0 0 100px;">
                        <option value="dashed">Nét đứt</option>
                        <option value="solid">Nét liền</option>
                        <option value="dotted">Chấm</option>
                        <option value="double">Đôi</option>
                        <option value="none">Không viền</option>
                    </select>
                </div>

                <div class="ctx-row">
                    <label>Bo góc</label>
                    <input type="number" id="ctxRadius" min="0" max="50" step="1" value="0">
                    <label style="flex:0 0 auto;font-size:12px;">px</label>
                </div>
            </div>

            <div class="ctx-row ctx-section" style="margin-bottom:0;">
                <button class="ctx-btn ctx-btn-apply" id="ctxApply">Áp dụng</button>
                <button class="ctx-btn ctx-btn-reset" id="ctxReset">Mặc định</button>
            </div>
        </div>

        <div id="ctxImage" style="display:none;">
            <div class="ctx-title">🖼️ Chỉnh sửa ảnh</div>

            <div class="ctx-row">
                <label>Chiều rộng</label>
                <input type="number" id="ctxImgW" min="20" step="1" value="100">
                <label style="flex:0 0 auto;font-size:12px;">px</label>
            </div>

            <div class="ctx-row">
                <label>Chiều cao</label>
                <input type="number" id="ctxImgH" min="20" step="1" value="100">
                <label style="flex:0 0 auto;font-size:12px;">px</label>
            </div>

            <div class="ctx-row">
                <label class="ctx-check" style="flex:0 0 100%;">
                    <input type="checkbox" id="ctxImgLockRatio" checked> Giữ tỉ lệ khung hình
                </label>
            </div>

            <div class="ctx-row">
                <label>Độ mờ</label>
                <input type="range" id="ctxImgOpacity" min="10" max="100" step="1" value="100">
                <span id="ctxImgOpacityVal" style="flex:0 0 40px;text-align:right;font-size:12px;color:#555;">100%</span>
            </div>

            <div class="ctx-row">
                <label>Xoay</label>
                <input type="range" id="ctxImgRotate" min="-180" max="180" step="1" value="0">
                <span id="ctxImgRotateVal" style="flex:0 0 40px;text-align:right;font-size:12px;color:#555;">0°</span>
            </div>

            <div class="ctx-section">
                <div class="ctx-row">
                    <button class="ctx-btn ctx-btn-apply" id="ctxImgApply">Áp dụng</button>
                    <button class="ctx-btn ctx-btn-reset" id="ctxImgReset">Reset</button>
                </div>
                <div class="ctx-row" style="margin-top:8px;">
                    <button class="ctx-btn ctx-btn-danger" id="ctxImgDelete" style="width:100%;">Xoá ảnh</button>
                </div>
            </div>
        </div>

    </div>

    <script>
    (function() {
        'use strict';

        var isBrave = !!(navigator.brave && navigator.brave.isBrave);
        if (navigator.brave && typeof navigator.brave.isBrave === 'function') {
            navigator.brave.isBrave().then(function(v) { isBrave = v; });
        }

        document.addEventListener('contextmenu', function(e) {
            var tb = e.target.closest && e.target.closest('.textbox');
            var iw = e.target.closest && e.target.closest('.img-wrapper');
            if (tb || iw) return;
            e.preventDefault();
            return false;
        });

        document.addEventListener('keydown', function(e) {
            var isInTextbox = e.target.classList && e.target.classList.contains('textbox');
            if (isInTextbox) {
                if (e.key === 'F12') { e.preventDefault(); return false; }
                if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
                if (e.ctrlKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); return false; }
                return;
            }

            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && ['I','J','C','K','i','j','c','k'].includes(e.key)) {
                e.preventDefault(); return false;
            }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); return false; }
            if (e.ctrlKey && ['c','C','a','A','x','X'].includes(e.key)) {
                e.preventDefault(); return false;
            }
        }, true);

        document.addEventListener('copy', function(e) {
            if (e.target.classList && e.target.classList.contains('textbox')) return;
            e.preventDefault(); return false;
        });
        document.addEventListener('cut', function(e) {
            if (e.target.classList && e.target.classList.contains('textbox')) return;
            e.preventDefault(); return false;
        });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });

        function createRecognition() {
            if (!SpeechRecognition) return null;
            var rec = new SpeechRecognition();
            rec.continuous = true;

            rec.lang = 'vi-VN';

            rec.onresult = function(event) {

                for (var i = event.resultIndex; i < event.results.length; i++) {
                    var transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) finalTranscript += transcript;
                    else interimTranscript += transcript;
                }

                var base = activeMicTextbox._speechBase || '';
                var combined = base + finalTranscript + interimTranscript;

                if (combined.trim().length > 0) {
                    el.classList.remove('placeholder');
                    el.textContent = combined;
                }

                if (finalTranscript) {
                    activeMicTextbox._speechBase = (base + finalTranscript);
                    if (!/\s$/.test(activeMicTextbox._speechBase)) {
                        activeMicTextbox._speechBase += ' ';
                    }

            rec.onerror = function(event) {

                              '3. Khởi động lại Brave và thử lại.\n\n' +
                              'Hoặc dùng Chrome/Edge để mic hoạt động ổn định hơn.');
                    }
                }

            rec.onend = function() {

            if (isListening && activeMicTextbox === tb) {
                stopSpeechRecognition();

            }

            if (isListening && activeMicTextbox && activeMicTextbox !== tb) {
                stopSpeechRecognition();
            }

            if (!recognition) recognition = createRecognition();
            if (!recognition) return;

            activeMicTextbox = tb;

            isListening = true;
            tb.classList.add('mic-active');

            if (tb.contentEditable !== 'true') {

            var startH = rect.height;
            var startL = rect.left + window.scrollX;
            var startT = rect.top + window.scrollY;

            // Lưu min-width/height từ computed style
            var cs = window.getComputedStyle(tb);
            var minW = parseFloat(cs.minWidth) || 120;
            var minH = parseFloat(cs.minHeight) || 30;

            function moveHandler(me) {
                var dx = me.clientX - startX;
                var dy = me.clientY - startY;
                var newW = startW, newH = startH, newL = startL, newT = startT;

                if (pos.indexOf('e') !== -1) newW = startW + dx;
                if (pos.indexOf('w') !== -1) { newW = startW - dx; newL = startL + dx; }
                if (pos.indexOf('s') !== -1) newH = startH + dy;
                if (pos.indexOf('n') !== -1) { newH = startH - dy; newT = startT + dy; }

                if (newW < minW) { newW = minW; if (pos.indexOf('w') !== -1) newL = startL + startW - minW; }
                if (newH < minH) { newH = minH; if (pos.indexOf('n') !== -1) newT = startT + startH - minH; }

                // Giới hạn max-width 80vw
                var maxW = window.innerWidth * 0.8;
                if (newW > maxW) {
                    newW = maxW;
                    if (pos.indexOf('w') !== -1) newL = startL + startW - maxW;
                }

                tb.style.width = newW + 'px';
                tb.style.height = newH + 'px';
                tb.style.left = newL + 'px';
                tb.style.top = newT + 'px';
            }
            function upHandler() {
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', upHandler);
            }
            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', upHandler);
        }

        // ========== TEXTBOX ==========
        function createTextbox(x, y, withMic) {
            var tb = document.createElement('div');
            tb.className = 'textbox';
            tb.contentEditable = 'false';
            tb.style.left = (x || 60) + 'px';
            tb.style.top = (y || 60) + 'px';
            tb.style.fontFamily = '"Segoe UI", Arial, sans-serif';
            tb.style.fontSize = '24px';
            tb.style.fontWeight = 'bold';
            tb.style.color = '#000000';

            var content = document.createElement('span');
            content.className = 'tb-content placeholder';
            content.textContent = PLACEHOLDER;
            tb.appendChild(content);

            tb._speechBase = '';

            content.addEventListener('input', function() {
                if (isPlaceholder(content)) {
                    if (content.textContent.trim() === '' || content.textContent.trim() === PLACEHOLDER) {
                        content.classList.add('placeholder');
                        content.textContent = PLACEHOLDER;
                    } else {
                        content.classList.remove('placeholder');
                    }
                }
                if (!isPlaceholder(content)) {
                    var t = (content.textContent || '').replace(/\s+$/, '');
                    tb._speechBase = t ? (t + ' ') : '';
                } else {
                    tb._speechBase = '';
                }
            });

            var del = document.createElement('span');
            del.className = 'tb-delete';
            del.textContent = '×';
            del.title = 'Xoá textbox';
            tb.appendChild(del);

            del.addEventListener('mousedown', function(ev) {
                ev.stopPropagation();
                ev.preventDefault();
                if (activeMicTextbox === tb) stopSpeechRecognition();
                if (tb.parentNode) tb.parentNode.removeChild(tb);
            });

            var mic = document.createElement('span');
            mic.className = 'tb-mic';
            mic.textContent = '🎤';
            mic.title = 'Nhấn để nhập bằng giọng nói';
            tb.appendChild(mic);

            mic.addEventListener('mousedown', function(ev) {
                ev.stopPropagation();
                ev.preventDefault();
                startSpeechRecognition(tb);
            });

            // === 8 RESIZE HANDLES ===
            var positions = ['nw','n','ne','e','se','s','sw','w'];
            positions.forEach(function(pos) {
                var h = document.createElement('div');
                h.className = 'resize-handle ' + pos;
                h.dataset.pos = pos;
                tb.appendChild(h);
                h.addEventListener('mousedown', function(ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    startTextboxResize(tb, ev, pos);
                });
            });

            tb.addEventListener('dblclick', function(ev) {
                ev.stopPropagation();
                enterEditMode(tb);
            });

            tb.addEventListener('contextmenu', function(ev) {
                ev.preventDefault();
                ev.stopPropagation();
                if (tb.contentEditable === 'true') tb.blur();
                deselectAll();
                openTextBoxMenu(tb, ev.clientX, ev.clientY);
            });

            tb.addEventListener('mousedown', function(ev) {
                if (tb.contentEditable === 'true') return;
                if (ev.target === del || ev.target === mic) return;
                if (ev.target.classList && ev.target.classList.contains('resize-handle')) return;
                if (ev.button === 2) return;
                ev.preventDefault();
                ev.stopPropagation();

                var rect = tb.getBoundingClientRect();
                var startX = ev.clientX;
                var startY = ev.clientY;
                var startLeft = rect.left + window.scrollX;
                var startTop = rect.top + window.scrollY;

                function moveHandler(me) {
                    var dx = me.clientX - startX;
                    var dy = me.clientY - startY;
                    tb.style.left = Math.max(0, startLeft + dx) + 'px';
                    tb.style.top = Math.max(0, startTop + dy) + 'px';
                }
                function upHandler() {
                    document.removeEventListener('mousemove', moveHandler);
                    document.removeEventListener('mouseup', upHandler);
                }
                document.addEventListener('mousemove', moveHandler);
                document.addEventListener('mouseup', upHandler);
            });

            tb.addEventListener('blur', function() {
                if (activeMicTextbox !== tb) exitEditMode(tb);
            });

            tb.addEventListener('keydown', function(ev) {
                if (ev.key === 'Escape') { ev.preventDefault(); tb.blur(); }
                ev.stopPropagation();
            });

            board.appendChild(tb);

            if (withMic) {
                setTimeout(function() { startSpeechRecognition(tb); }, 200);
            }

            return tb;
        }

        function enterEditMode(tb) {
            tb.contentEditable = 'true';
            tb.classList.add('editing');
            tb.focus();
            var contentEl = getContentEl(tb);
            if (contentEl && isPlaceholder(contentEl)) {
                var range = document.createRange();
                range.selectNodeContents(contentEl);
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        function exitEditMode(tb) {
            tb.contentEditable = 'false';
            tb.classList.remove('editing');
        }

        // ========== IMAGE WRAPPER ==========
        function createImageWrapper(src) {
            var wrapper = document.createElement('div');
            wrapper.className = 'img-wrapper';
            wrapper.dataset.rotate = 0;
            wrapper.style.left = '40px';
            wrapper.style.top = '40px';
            wrapper.style.width = '300px';
            wrapper.style.height = 'auto';

            var img = document.createElement('img');
            img.src = src;
            img.draggable = false;
            img.alt = '';
            img.addEventListener('dragstart', function(e) { e.preventDefault(); });
            wrapper.appendChild(img);

            var positions = ['nw','n','ne','e','se','s','sw','w'];
            positions.forEach(function(pos) {
                var h = document.createElement('div');
                h.className = 'resize-handle ' + pos;
                h.dataset.pos = pos;
                wrapper.appendChild(h);
                h.addEventListener('mousedown', function(ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    startResize(wrapper, ev, pos);
                });
            });

            var del = document.createElement('span');
            del.className = 'img-delete';
            del.textContent = '×';
            del.title = 'Xoá ảnh';
            wrapper.appendChild(del);
            del.addEventListener('mousedown', function(ev) {
                ev.stopPropagation();
                ev.preventDefault();
                if (wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
            });

            img.onload = function() {
                var nw = img.naturalWidth;
                var nh = img.naturalHeight;
                if (nw && nh) {
                    wrapper.style.height = (300 * nh / nw) + 'px';
                }
                updateBoardHeight();
            };

            wrapper.addEventListener('mousedown', function(ev) {
                if (isDrawing) return;
                if (ev.button === 2) return;
                ev.preventDefault();
                ev.stopPropagation();
                deselectAll();
                wrapper.classList.add('selected');
                selectedWrapper = wrapper;

                var startX = ev.clientX;
                var startY = ev.clientY;
                var startLeft = parseInt(wrapper.style.left, 10) || 0;
                var startTop = parseInt(wrapper.style.top, 10) || 0;

                function moveHandler(me) {
                    var dx = me.clientX - startX;
                    var dy = me.clientY - startY;
                    wrapper.style.left = Math.max(0, startLeft + dx) + 'px';
                    wrapper.style.top = Math.max(0, startTop + dy) + 'px';
                }
                function upHandler() {
                    document.removeEventListener('mousemove', moveHandler);
                    document.removeEventListener('mouseup', upHandler);
                }
                document.addEventListener('mousemove', moveHandler);
                document.addEventListener('mouseup', upHandler);
            });

            wrapper.addEventListener('contextmenu', function(ev) {
                ev.preventDefault();
                ev.stopPropagation();
                deselectAll();
                wrapper.classList.add('selected');
                selectedWrapper = wrapper;
                openImageMenu(wrapper, ev.clientX, ev.clientY);
            });

            board.appendChild(wrapper);
            return wrapper;
        }

        function startResize(wrapper, startEvent, pos) {
            var startX = startEvent.clientX;
            var startY = startEvent.clientY;
            var startW = wrapper.offsetWidth;
            var startH = wrapper.offsetHeight;
            var startL = parseInt(wrapper.style.left, 10) || 0;
            var startT = parseInt(wrapper.style.top, 10) || 0;

            var img = wrapper.querySelector('img');
            var naturalRatio = img && img.naturalWidth ? img.naturalWidth / img.naturalHeight : 1;
            var keepRatio = !startEvent.shiftKey;

            function moveHandler(me) {
                var dx = me.clientX - startX;
                var dy = me.clientY - startY;
                var newW = startW, newH = startH, newL = startL, newT = startT;

                if (pos.indexOf('e') !== -1) newW = startW + dx;
                if (pos.indexOf('w') !== -1) { newW = startW - dx; newL = startL + dx; }
                if (pos.indexOf('s') !== -1) newH = startH + dy;
                if (pos.indexOf('n') !== -1) { newH = startH - dy; newT = startT + dy; }

                if (newW < 20) { newW = 20; if (pos.indexOf('w') !== -1) newL = startL + startW - 20; }
                if (newH < 20) { newH = 20; if (pos.indexOf('n') !== -1) newT = startT + startH - 20; }

                if (keepRatio) {
                    if (pos === 'n' || pos === 's') {
                        newW = newH * naturalRatio;
                    } else if (pos === 'e' || pos === 'w') {
                        newH = newW / naturalRatio;
                    } else {
                        if (Math.abs(dx) > Math.abs(dy)) newH = newW / naturalRatio;
                        else newW = newH * naturalRatio;
                        if (pos.indexOf('w') !== -1) newL = startL + startW - newW;
                        if (pos.indexOf('n') !== -1) newT = startT + startH - newH;
                    }
                }

                wrapper.style.width = newW + 'px';
                wrapper.style.height = newH + 'px';
                wrapper.style.left = newL + 'px';
                wrapper.style.top = newT + 'px';
            }
            function upHandler() {
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', upHandler);
            }
            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', upHandler);
        }

        board.addEventListener('mousedown', function(e) {
            if (isDrawing) return;
            if (e.target === board || e.target === canvas) deselectAll();
        });

        // ========== PASTE IMAGE ==========
        function handlePaste() {
            if (navigator.clipboard && navigator.clipboard.read) {
                navigator.clipboard.read().then(function(items) {
                    for (var i = 0; i < items.length; i++) {
                        var item = items[i];
                        for (var j = 0; j < item.types.length; j++) {
                            var type = item.types[j];
                            if (type.indexOf('image') === 0) {
                                item.getType(type).then(function(blob) {
                                    var url = URL.createObjectURL(blob);
                                    addImageFromSrc(url);
                                });
                                return;
                            }
                        }
                    }
                }).catch(function(err) {
                    console.log('Clipboard API không khả dụng:', err);
                });
            }
        }

        document.addEventListener('paste', function(e) {
            var isInTextbox = e.target.classList && e.target.classList.contains('textbox');
            if (isInTextbox) return;
            var items = (e.clipboardData || window.clipboardData).items;
            if (!items) return;
            for (var i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') === 0) {
                    var blob = items[i].getAsFile();
                    if (blob) {
                        var url = URL.createObjectURL(blob);
                        addImageFromSrc(url);
                        e.preventDefault();
                    }
                }
            }
        });

        function addImageFromSrc(src) {
            var wrapper = createImageWrapper(src);
            var cx = window.scrollX + window.innerWidth / 2 - 150;
            var cy = window.scrollY + window.innerHeight / 2 - 100;
            wrapper.style.left = Math.max(0, cx) + 'px';
            wrapper.style.top = Math.max(0, cy) + 'px';
            updateBoardHeight();
            setTimeout(resizeCanvas, 100);
        }

        function updateBoardHeight() {
            board.style.minHeight = '100vh';
        }

        // ========== BÀN PHÍM ==========
        document.addEventListener('keydown', function(e) {
            var tag = (e.target.tagName || '').toLowerCase();
            var isInTextbox = e.target.classList && e.target.classList.contains('textbox');
            if (isInTextbox) return;
            if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

            var key = e.key;
            switch (key) {
                case 'v': case 'V':
                    isDrawing = !isDrawing;
                    if (isDrawing) {
                        canvas.classList.add('active');
                        document.body.classList.add('drawing-mode');
                        deselectAll();
                    } else {
                        canvas.classList.remove('active');
                        canvas.classList.remove('eraser');
                        document.body.classList.remove('drawing-mode');
                        isErasing = false;
                        isPointerDown = false;
                        currentStroke = null;
                    }
                    e.preventDefault();
                    break;

                case 'z': case 'Z':
                    var mx = window.innerWidth / 2;
                    var my = window.innerHeight / 2;
                    openDrawMenu(mx, my);
                    e.preventDefault();
                    break;

                case 'a': case 'A':
                    var viewCenterX = window.scrollX + window.innerWidth / 2 - 60;
                    var viewCenterY = window.scrollY + window.innerHeight / 2 - 15;
                    createTextbox(viewCenterX, viewCenterY, true);
                    e.preventDefault();
                    break;

                case '0':
                    if (isDrawing) { strokeColor = '#0066CC'; isErasing = false; canvas.classList.remove('eraser'); }
                    e.preventDefault();
                    break;
                case '1':
                    if (isDrawing) { strokeColor = '#FF0000'; isErasing = false; canvas.classList.remove('eraser'); }
                    e.preventDefault();
                    break;
                case 'd': case 'D':
                    if (isDrawing) { strokeColor = '#000000'; isErasing = false; canvas.classList.remove('eraser'); }
                    e.preventDefault();
                    break;
                case 'n': case 'N':
                    if (isDrawing) { strokeColor = DEFAULT_COLOR; isErasing = false; canvas.classList.remove('eraser'); }
                    e.preventDefault();
                    break;
                case 'b': case 'B':
                    if (isDrawing) {
                        strokeWidth += 1;
                        if (strokeWidth > 50) strokeWidth = 50;
                        isErasing = false;
                        canvas.classList.remove('eraser');
                    }
                    e.preventDefault();
                    break;
                case 'm': case 'M':
                    if (isDrawing) {
                        strokeWidth -= 1;
                        if (strokeWidth < 1) strokeWidth = 1;
                        isErasing = false;
                        canvas.classList.remove('eraser');
                    }
                    e.preventDefault();
                    break;
                case '2':
                    if (isDrawing) { strokeWidth = DEFAULT_WIDTH; isErasing = false; canvas.classList.remove('eraser'); }
                    e.preventDefault();
                    break;
                case '3':
                    if (isDrawing) { isErasing = true; canvas.classList.add('eraser'); }
                    e.preventDefault();
                    break;

                case '4':
                    document.body.classList.add('gray-bg');
                    e.preventDefault();
                    break;
                case '5':
                    document.body.classList.remove('gray-bg');
                    e.preventDefault();
                    break;

                case 'x': case 'X':
                    if (isDrawing) {
                        strokes = [];
                        currentStroke = null;
                        redrawAll();
                    }
                    e.preventDefault();
                    break;

                case 't': case 'T':
                    var tx = window.scrollX + window.innerWidth / 2 - 60;
                    var ty = window.scrollY + window.innerHeight / 2 - 15;
                    var newTb = createTextbox(tx, ty);
                    setTimeout(function() { enterEditMode(newTb); }, 50);
                    e.preventDefault();
                    break;

                case 'p': case 'P':
                    handlePaste();
                    e.preventDefault();
                    break;

                default:
                    break;
            }
        }, true);

        // ========== KHỞI TẠO ==========
        function init() {
            resizeCanvas();
            updateBoardHeight();
        }

        window.addEventListener('load', function() { setTimeout(init, 100); });

        window.addEventListener('resize', function() {
            updateBoardHeight();
            resizeCanvas();
        });

        if (window.ResizeObserver) {
            var ro = new ResizeObserver(function() { resizeCanvas(); });
            ro.observe(board);
        }

        document.addEventListener('mousedown', function(e) {
            if (e.button === 2) e.preventDefault();
        });

    })();
    </script>
