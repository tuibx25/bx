<style>
:root { --ink: #000000; --bg: #F5F5F5; --white: #FFFFFF; --border: #D3D3D3; --primary: #004488; --primary-light: #0066CC; --brown: #8B5A2B; --brown-d: #8B4513; --beige: #F5F5DC; --wheat: #F5DEB3; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--ink); }
.container { max-width: 900px; margin: 0 auto; background: var(--white); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--border); }
h2 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
.student-info-bar { background: var(--beige); border: 1px solid var(--wheat); color: var(--brown-d); padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
.student-info-bar span { color: var(--primary); font-size: 1.1em; }
#displayClass { text-transform: uppercase; }
.exam-card { border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; background: var(--white); transition: 0.2s;}
.exam-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.exam-card h3 { margin: 0 0 5px 0; color: var(--ink); }
.exam-card p { margin: 0 0 5px 0; color: var(--brown-d); font-size: 14px; font-weight: 600;}
.attempt-badge { display: inline-block; padding: 3px 8px; background: var(--beige); border: 1px solid var(--border); border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 8px;}
.score-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.score-badge { padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; border: 1px solid var(--border); }
.score-badge.published { background: var(--wheat); color: var(--brown-d); border-color: var(--brown); }
.score-badge.best { background: var(--primary); color: var(--white); border-color: var(--primary); }
.score-badge.pending { background: var(--bg); color: #888888; border-color: var(--border); font-style: italic; font-weight: normal; opacity: 0.7; }
.btn { background: var(--primary); color: var(--white); border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; text-decoration: none; display: inline-block;}
.btn:hover:not(:disabled) { background: var(--primary-light); }
.btn:disabled { background: var(--border); color: #888; cursor: not-allowed; }
.btn-submit { background: var(--brown-d); color: var(--white); padding: 8px 15px; font-size: 14px; border-radius: 6px; font-weight: bold;}
.btn-submit:hover { background: var(--brown); }
.btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
#quizHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; background: var(--white); z-index: 10; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: nowrap; }
#timerDisplay { font-size: 20px; font-weight: bold; color: var(--brown-d); background: var(--beige); padding: 5px 12px; border-radius: 5px; border: 1px solid var(--wheat); white-space: nowrap; }
.stat-badge { background: var(--white); border: 1.5px solid var(--border); padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 13px; white-space: nowrap; color: var(--ink); }
.stat-badge b { color: var(--primary); font-size: 15px; }
.spacer { flex: 1 1 auto; }
.part-title { font-weight: 800; font-size: 1.1em; color: var(--brown-d); margin: 25px 0 10px; padding: 10px; background: var(--beige); border-left: 5px solid var(--brown-d); border-radius: 0 5px 5px 0; }
.question { border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; border-radius: 8px; background: var(--white); }
.q-text { font-weight: 600; margin-bottom: 10px; line-height: 1.5; color: var(--ink); }
.options { display: flex; flex-direction: column; gap: 8px; }
.option-label { padding: 10px; border: 1px solid var(--border); border-radius: 5px; cursor: pointer; display: flex; gap: 10px; transition: 0.1s; background: var(--white);}
.option-label:hover { background: var(--bg); border-color: var(--brown);}
.option-label input[type="radio"] { margin-top: 4px; cursor: pointer; }
.option-label.selected { background: var(--wheat); border-color: var(--brown-d); }
.statements { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.st-row { display: flex; gap: 15px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--white);}
.st-btns { display: flex; gap: 15px; }
.st-btns label { cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--ink);}
.st-btns input[type="radio"]:checked + span { font-weight: bold; color: var(--primary); }
.short-input { padding: 10px; border: 1px solid var(--border); border-radius: 5px; width: 300px; font-size: 16px; color: var(--ink); background: var(--white);}
.short-input:focus { outline: none; border-color: var(--primary-light); }
.hidden { display: none !important; }
@media (max-width: 768px) {
body { padding: 10px; }
.container { padding: 15px; }
.student-info-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
.exam-card { flex-direction: column; align-items: stretch; gap: 15px; }
.exam-card .btn { width: 100%; padding: 12px; font-size: 16px; }
#quizHeader { padding: 8px 0; gap: 6px; }
#timerDisplay { font-size: 15px; padding: 4px 8px; margin-left: auto; }
.stat-badge { font-size: 11px; padding: 3px 6px; }
.btn-submit { padding: 6px 10px; font-size: 12px; }
.st-row { flex-direction: column; align-items: flex-start; gap: 10px; }
.st-btns { width: 100%; justify-content: space-around; background: var(--bg); padding: 8px; border-radius: 5px; margin-top: 5px;}
.short-input { width: 100%; box-sizing: border-box; }
}
</style>
</head>
<body>
<div id="loadingScreen" style="text-align: center; margin-top: 50px;">
<h2>🔄 Đang kết nối máy chủ dữ liệu...</h2>
</div>
<div id="dashboardScreen" class="container hidden">
<div class="student-info-bar">
<div style="display: flex; flex-direction: column; gap: 5px;">
<div>👤 Học sinh: <span id="displayName">Đang tải...</span></div>
<div>🏫 Lớp: <span id="displayClass">...</span></div>
</div>
<a href="../" class="btn btn-outline">🏠 Trang Chủ</a>
</div>
<h2>📝 BÀI TẬP TRẮC NGHIỆM</h2>
<div id="examList">Đang tải danh sách...</div>
</div>
<div id="quizScreen" class="container hidden">
<div id="quizHeader">
<button class="btn" onclick="backToDashboard()" style="padding: 6px 10px; font-size: 16px;" title="Quay lại danh sách">🏠</button>
<span class="stat-badge">Đã làm: <b id="answeredCount">0</b>/<span id="totalCount">0</span></span>
<div id="timerDisplay">15:00</div>
<button class="btn-submit" id="btnSubmitQuiz" onclick="submitExam()">Nộp Bài</button>
</div>
<div id="quizBody" autocomplete="off"></div>
</div>
<div id="doneScreen" class="container hidden" style="text-align: center;">
<h2 style="color: var(--primary); border:none;">✅ Đã Nộp Bài Thành Công!</h2>
<p style="font-size: 16px; color: var(--ink);">Vui lòng chờ Giáo viên chấm điểm và công bố kết quả.</p>
<button class="btn" onclick="location.reload()" style="margin-top: 20px; width: 100%;">Quay lại Danh Sách Bài Tập</button>
</div>
