 <!-- BẢO MẬT -->
 <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.keyCode === 85) e.preventDefault(); // Ctrl+U
        if (e.ctrlKey && e.keyCode === 83) e.preventDefault(); // Ctrl+S
        if (e.ctrlKey && e.keyCode === 80) e.preventDefault(); // Ctrl+P
        if (e.keyCode === 123) e.preventDefault(); // F12
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) e.preventDefault(); // Ctrl+Shift+I
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) e.preventDefault(); // Ctrl+Shift+J
        if (e.ctrlKey && e.shiftKey && e.keyCode === 67) e.preventDefault(); // Ctrl+Shift+C
    });
    document.addEventListener('dragstart', function(e) { if (e.target.tagName === 'IMG') e.preventDefault(); });
    document.addEventListener('copy', function(e) { e.preventDefault(); alert('Không cho phép sao chép nội dung!'); });
    document.addEventListener('cut', function(e) { e.preventDefault(); });
    document.addEventListener('paste', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
    document.addEventListener('mousedown', function(e) { if (e.detail > 1) e.preventDefault(); });
 </script>

    body {

    body::before {

        left: 0;

<script>
// Hàm cập nhật giờ Hà Nội (GMT+7)
function updateHanoiTime() {
    var now = new Date();
    // Lấy giờ UTC và cộng thêm 7 giờ cho múi giờ Hà Nội
    var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    var hanoiTime = new Date(utc + (3600000 * 7));
    
    // Định dạng ngày giờ
    var days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    var dayName = days[hanoiTime.getDay()];
    var date = hanoiTime.getDate().toString().padStart(2, '0');
    var month = (hanoiTime.getMonth() + 1).toString().padStart(2, '0');
    var year = hanoiTime.getFullYear();
    var hours = hanoiTime.getHours().toString().padStart(2, '0');
    var minutes = hanoiTime.getMinutes().toString().padStart(2, '0');
    var seconds = hanoiTime.getSeconds().toString().padStart(2, '0');
    
    // Hiển thị kết quả
    document.getElementById('clock-time').innerHTML = 
        hours + ' : ' + minutes + ' : ' + seconds;
    
    document.getElementById('clock-date').innerHTML = 
        dayName + ', ' + date + '/' + month + '/' + year;
}

// Cập nhật mỗi giây
setInterval(updateHanoiTime, 1000);

// Chạy lần đầu ngay khi tải trang
updateHanoiTime();
</script>
