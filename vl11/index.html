<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vật Lý 11 KNTT</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <style>
        /* CSS hiện tại của bạn vẫn giữ nguyên */
        :root {
            --primary: #8B4513;
            --secondary: #A0522D;
            --accent: #D2691E;
            --success: #8B7355;
            --dark: #3E2723;
            --light: #F5F5DC;
            --neutral: #BC8F8F;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 50px rgba(0, 0, 0, 0.15);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: #FAF3E0;
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            /* Chống chọn và sao chép */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Thêm Watermark */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdn.jsdelivr.net/gh/tuibx25/images/bx/tuibx.png');
            background-repeat: repeat;
            background-size: 300px 100px;
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(139, 69, 19, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(160, 82, 45, 0.05) 0%, transparent 50%);
            z-index: -1;
        }
        
        /* Thêm lớp overlay bảo vệ */
        .protector {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Phần còn lại của CSS giữ nguyên */
        header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 30px;
            background: var(--primary);
            border-radius: 24px;
            color: white;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent);
            animation: shimmer 3s infinite linear;
        }
        
        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }
        
        .header-content {
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: #FFF8DC;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        
        .chapters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        
        .chapter-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(210, 105, 30, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .chapter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        
        .chapter-card:hover::before {
            transform: translateX(100%);
        }
        
        .chapter-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }
        
        .chapter-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, currentColor, transparent) 1;
        }
        
        .chapter-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: var(--secondary);
        }
        
        .chapter-card:nth-child(1) .chapter-icon { background: var(--primary); }
        .chapter-card:nth-child(2) .chapter-icon { background: var(--secondary); }
        .chapter-card:nth-child(3) .chapter-icon { background: var(--accent); }
        .chapter-card:nth-child(4) .chapter-icon { background: var(--success); }
        
        .chapter-title {
            color: var(--dark);
            font-size: 1.5rem;
            font-weight: 600;
            flex: 1;
        }
        
        .lesson-list {
            list-style-type: none;
        }
        
        .lesson-item {
            padding: 0;
            margin-bottom: 8px;
            position: relative;
        }
        
        .lesson-link {
            text-decoration: none;
            color: var(--dark);
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            transition: all 0.3s;
            background: rgba(245, 245, 220, 0.5);
            border: 1px solid rgba(139, 69, 19, 0.1);
            position: relative;
            overflow: hidden;
            /* Cho phép click trên link */
            pointer-events: auto;
        }
        
        .lesson-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform 0.3s;
        }
        
        .lesson-link:hover {
            background: #FFF8DC;
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.1);
        }
        
        .lesson-link:hover::before {
            transform: scaleY(1);
        }
        
        .lesson-link:hover .lesson-arrow {
            transform: translateX(5px);
            opacity: 1;
        }
        
        .lesson-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--secondary);
            color: white;
            border-radius: 10px;
            margin-right: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(139, 69, 19, 0.2);
            flex-shrink: 0;
        }
        
        .lesson-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .lesson-title {
            font-weight: 500;
            margin-bottom: 3px;
        }
        
        .lesson-subtitle {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        
        .lesson-arrow {
            width: 24px;
            height: 24px;
            opacity: 0.5;
            transition: all 0.3s;
            color: var(--primary);
        }
        
        .home-button {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            padding: 14px 28px;
            background: rgba(255, 248, 220, 0.95);
            color: var(--primary);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid rgba(139, 69, 19, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            z-index: 10;
            pointer-events: auto;
        }
        
        .home-button:hover {
            background: #FFF8DC;
            color: var(--dark);
            transform: translateY(-50%) translateX(-5px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.15);
            border-color: var(--accent);
        }
        
        .home-button .button-icon {
            transition: transform 0.3s;
        }
        
        .home-button:hover .button-icon {
            transform: translateX(-3px);
        }
        
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            color: var(--dark);
            font-size: 0.95rem;
            background: rgba(255, 248, 220, 0.9);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(139, 69, 19, 0.1);
        }
        
        .footer-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .footer-subtext {
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        .particle {
            position: fixed;
            border-radius: 50%;
            background: var(--secondary);
            opacity: 0.1;
            z-index: -1;
        }
        
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--primary);
            z-index: 1000;
            transition: width 0.3s;
        }
        
        @media (max-width: 768px) {
            .chapters {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            h1 {
                font-size: 2.2rem;
                margin-top: 20px;
            }
            
            .home-button {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                margin: 0 auto 20px;
                display: inline-flex;
                width: fit-content;
            }
            
            header {
                padding: 30px 20px;
                text-align: center;
            }
            
            .chapter-card {
                padding: 25px;
            }
            
            .lesson-link {
                padding: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .chapters {
                grid-template-columns: 1fr;
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chapter-card {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .chapter-card:nth-child(1) { animation-delay: 0.1s; }
        .chapter-card:nth-child(2) { animation-delay: 0.2s; }
        .chapter-card:nth-child(3) { animation-delay: 0.3s; }
        .chapter-card:nth-child(4) { animation-delay: 0.4s; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Lớp bảo vệ chống xem mã nguồn -->
    <div class="protector" id="pageProtector"></div>
    
    <div class="progress-bar" id="progressBar"></div>
    
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Vật Lý 11</h1>
                <p class="subtitle">Kết Nối Tri Thức Với Cuộc Sống</p>
                <a href="../" class="home-button">
                    <span class="button-icon">←</span>
                    Trang chủ
                </a>
            </div>
        </header>
        
        <div class="chapters" id="chapters-container">
            <!-- Nội dung sẽ được tạo tự động bằng JavaScript -->
        </div>
        
        <footer>
            <p class="footer-text">TuiBX</p>
            <p class="footer-subtext">© 2025 - Tài liệu học tập Vật Lý 11</p>
        </footer>
    </div>

    <script>
        // Các biện pháp bảo mật cơ bản (không bao gồm kiểm tra DevTools)
        (function() {
            'use strict';
            
            // Chống nhấp chuột phải
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Chống các phím tắt xem mã nguồn
            document.addEventListener('keydown', function(e) {
                // Ctrl+U (xem mã nguồn)
                if (e.ctrlKey && e.key === 'u') {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+Shift+I (DevTools)
                if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+Shift+J (Console)
                if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+Shift+C (Inspect)
                if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                    e.preventDefault();
                    return false;
                }
                // F12 (DevTools)
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Chống sao chép
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                alert('Không được phép sao chép nội dung!');
                return false;
            });
            
            // Chống kéo thả hình ảnh
            document.addEventListener('dragstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Đã loại bỏ hoàn toàn phần phát hiện DevTools
        })();
        
        // Dữ liệu và hàm hiện có vẫn giữ nguyên
        const physicsChapters = [
            {
                title: "Chương 1. DAO ĐỘNG",
                subtitle: "Nghiên cứu chuyển động tuần hoàn",
                lessons: [
                    {title: "Dao động điều hoà", type: "Lý thuyết"},
                    {title: "Mô tả dao động điều hoà", type: "Lý thuyết"},
                    {title: "Vận tốc, gia tốc trong dao động điều hoà", type: "Lý thuyết"},
                    {title: "Bài tập về dao động điều hoà", type: "Bài tập"},
                    {title: "Động năng. Thế năng. Sự chuyển hoá năng lượng", type: "Lý thuyết"},
                    {title: "Dao động tắt dần. Dao động cưỡng bức", type: "Lý thuyết"},
                    {title: "Bài tập về sự chuyển năng lượng", type: "Bài tập"}
                ]
            },
            {
                title: "Chương 2. SÓNG",
                subtitle: "Truyền năng lượng không mang vật chất",
                lessons: [
                    {title: "Mô tả sóng", type: "Lý thuyết"},
                    {title: "Sóng ngang, sóng dọc", type: "Lý thuyết"},
                    {title: "Thực hành: Đo tần số sóng âm", type: "Thực hành"},
                    {title: "Sóng điện từ", type: "Lý thuyết"},
                    {title: "Giao thoa sóng", type: "Lý thuyết"},
                    {title: "Sóng dừng", type: "Lý thuyết"},
                    {title: "Bài tập về sóng", type: "Bài tập"},
                    {title: "Thực hành: Đo tốc độ truyền âm", type: "Thực hành"}
                ]
            },
            {
                title: "Chương 3. ĐIỆN TRƯỜNG",
                subtitle: "Trường lực tác dụng lên điện tích",
                lessons: [
                    {title: "Lực tương tác giữa hai điện tích", type: "Lý thuyết"},
                    {title: "Khái niệm điện trường", type: "Lý thuyết"},
                    {title: "Điện trường đều", type: "Lý thuyết"},
                    {title: "Thế năng điện", type: "Lý thuyết"},
                    {title: "Điện thế", type: "Lý thuyết"},
                    {title: "Tụ điện", type: "Lý thuyết"}
                ]
            },
            {
                title: "Chương 4. DÒNG ĐIỆN",
                subtitle: "Dòng chuyển dời có hướng của điện tích",
                lessons: [
                    {title: "Cường độ dòng điện", type: "Lý thuyết"},
                    {title: "Điện trở. Định luật Ohm", type: "Lý thuyết"},
                    {title: "Nguồn điện", type: "Lý thuyết"},
                    {title: "Năng lượng điện và công suất điện", type: "Lý thuyết"},
                    {title: "Thực hành: Đo suất điện động", type: "Thực hành"}
                ]
            }
        ];

        const chapterIcons = ["📊", "🌊", "⚡", "🔌"];

        function generateLessonLink(lessonIndex) {
            const lessonNumber = (lessonIndex + 1).toString().padStart(2, '0');
            return `./${lessonNumber}/`;
        }

        function createParticles() {
            const colors = ['#8B4513', '#A0522D', '#D2691E', '#BC8F8F'];
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.width = `${Math.random() * 100 + 50}px`;
                particle.style.height = particle.style.width;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.opacity = `${Math.random() * 0.1 + 0.05}`;
                particle.style.animation = `float ${Math.random() * 20 + 10}s infinite ease-in-out`;
                document.body.appendChild(particle);
            }
        }

        function updateProgressBar() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";
        }

        function renderChapters() {
            const container = document.getElementById('chapters-container');
            let lessonCounter = 0;
            
            physicsChapters.forEach((chapter, chapterIndex) => {
                const chapterCard = document.createElement('div');
                chapterCard.className = 'chapter-card';
                
                const chapterHeader = document.createElement('div');
                chapterHeader.className = 'chapter-header';
                
                const chapterIcon = document.createElement('div');
                chapterIcon.className = 'chapter-icon';
                chapterIcon.textContent = chapterIcons[chapterIndex];
                
                const chapterTitleDiv = document.createElement('div');
                chapterTitleDiv.className = 'chapter-title';
                chapterTitleDiv.innerHTML = `
                    <div>${chapter.title}</div>
                    <div style="font-size: 0.9rem; opacity: 0.7; font-weight: 400; margin-top: 5px;">
                        ${chapter.subtitle}
                    </div>
                `;
                
                chapterHeader.appendChild(chapterIcon);
                chapterHeader.appendChild(chapterTitleDiv);
                
                const lessonList = document.createElement('ul');
                lessonList.className = 'lesson-list';
                
                chapter.lessons.forEach((lesson, index) => {
                    const lessonItem = document.createElement('li');
                    lessonItem.className = 'lesson-item';
                    
                    const lessonLink = document.createElement('a');
                    lessonLink.className = 'lesson-link';
                    lessonLink.href = generateLessonLink(lessonCounter);
                    lessonLink.target = "_blank";
                    lessonLink.rel = "noopener noreferrer";
                    
                    lessonLink.innerHTML = `
                        <div class="lesson-number">${(lessonCounter + 1).toString().padStart(2, '0')}</div>
                        <div class="lesson-content">
                            <div class="lesson-title">${lesson.title}</div>
                            <div class="lesson-subtitle">${lesson.type}</div>
                        </div>
                        <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    `;
                    
                    lessonLink.addEventListener('click', function(e) {
                        const lessonNum = (lessonCounter + 1).toString().padStart(2, '0');
                        console.log(`Chuyển đến bài ${lessonNum}: ${generateLessonLink(lessonCounter)}`);
                    });
                    
                    lessonItem.appendChild(lessonLink);
                    lessonList.appendChild(lessonItem);
                    lessonCounter++;
                });
                
                chapterCard.appendChild(chapterHeader);
                chapterCard.appendChild(lessonList);
                container.appendChild(chapterCard);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderChapters();
            createParticles();
            window.addEventListener('scroll', updateProgressBar);
        });
    </script>
</body>
</html>
