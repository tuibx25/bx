<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Cuối Kỳ II Vật Lý 11</title>
	<link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/tuibx25/images/bx/favicon.ico">
    <style>
        :root {
            --brown-gold: #8B5A2B;
            --brown-dark: #8B4513;
            --white: #FFFFFF;
            --light-gray: #F5F5F5;
            --beige-light: #F5F5DC;
            --wheat: #F5DEB3;
            --gray-light: #D3D3D3;
            --blue-primary: #0066CC;
            --blue-dark: #004488;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light-gray);
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            background: var(--gray-light);
            padding: 5px 5px 0 5px;
            border-radius: 8px 8px 0 0;
            border-bottom: 3px solid var(--brown-dark);
        }

        .tab-btn {
            padding: 12px 20px;
            background: var(--wheat);
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--brown-dark);
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            min-width: 100px;
            flex: 1;
            max-width: 150px;
            position: relative;
            top: 3px;
        }

        .tab-btn:hover {
            background: var(--beige-light);
            color: var(--blue-dark);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--blue-primary);
            border-bottom: 3px solid var(--blue-primary);
            top: 0;
            font-weight: 700;
            box-shadow: 0 -2px 10px rgba(0,102,204,0.2);
        }

        /* Tab Content */
        .tab-content {
            background: var(--white);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 100vh;
        }

        .tab-pane {
            display: none;
            height: 100%;
        }

        .tab-pane.active {
            display: block;
        }

        .iframe-container {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
            border-radius: 0 0 8px 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .tab-nav {
                flex-direction: column;
                padding: 10px;
            }
            
            .tab-btn {
                max-width: none;
                border-radius: 8px;
                top: 0;
                margin: 2px 0;
            }
            
            .tab-btn.active {
                border-bottom: none;
                border-left: 4px solid var(--blue-primary);
            }
            
            .tab-content {
                border-radius: 10px;
            }
            
            .iframe-container {
                height: calc(100vh - 60px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="tab1">Bài 16</button>
            <button class="tab-btn" data-tab="tab2">Bài 17</button>
            <button class="tab-btn" data-tab="tab3">Bài 18</button>
            <button class="tab-btn" data-tab="tab4">Bài 19</button>
            <button class="tab-btn" data-tab="tab5">Bài 20</button>
            <button class="tab-btn" data-tab="tab6">Bài 21</button>
            <button class="tab-btn" data-tab="tab7">Bài 22</button>
            <button class="tab-btn" data-tab="tab8">Bài 23</button>
            <button class="tab-btn" data-tab="tab9">Bài 24</button>
        </nav>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Tab 1 -->
            <div id="tab1" class="tab-pane active">
                <iframe src="https://tuibx25.github.io/bx/vl11/16/d" class="iframe-container" title="Bài 16" loading="lazy"></iframe>
            </div>

            <!-- Tab 2 -->
            <div id="tab2" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/17/d" class="iframe-container" title="Bài 17" loading="lazy"></iframe>
            </div>

            <!-- Tab 3 -->
            <div id="tab3" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/18/d" class="iframe-container" title="Bài 18" loading="lazy"></iframe>
            </div>

            <!-- Tab 4 -->
            <div id="tab4" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/19/d" class="iframe-container" title="Bài 19" loading="lazy"></iframe>
            </div>

            <!-- Tab 5 -->
            <div id="tab5" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/20/d" class="iframe-container" title="Bài 20" loading="lazy"></iframe>
            </div>

            <!-- Tab 6 -->
            <div id="tab6" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/21/d" class="iframe-container" title="Bài 21" loading="lazy"></iframe>
            </div>

            <!-- Tab 7 -->
            <div id="tab7" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/22/d" class="iframe-container" title="Bài 22" loading="lazy"></iframe>
            </div>

            <!-- Tab 8 -->
            <div id="tab8" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/23/d" class="iframe-container" title="Bài 23" loading="lazy"></iframe>
            </div>

            <!-- Tab 9 -->
            <div id="tab9" class="tab-pane">
                <iframe src="https://tuibx25.github.io/bx/vl11/24/d" class="iframe-container" title="Bài 24" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Tab switching functionality
        document.addEventListener('DOMContentLoaded', function() {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabPanes = document.querySelectorAll('.tab-pane');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all
                    tabBtns.forEach(b => b.classList.remove('active'));
                    tabPanes.forEach(p => p.classList.remove('active'));
                    
                    // Add active class to clicked button
                    btn.classList.add('active');
                    
                    // Show corresponding tab pane
                    const tabId = btn.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                });
            });

            // Smooth fade-in for iframes
            document.querySelectorAll('iframe').forEach(iframe => {
                iframe.addEventListener('load', function() {
                    this.style.opacity = '1';
                });
                iframe.style.opacity = '0';
                iframe.style.transition = 'opacity 0.3s ease';
            });
        });
    </script>
</body>
</html>
