<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vẽ nháp</title>
  <style>
    /* Reset hoàn toàn */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFFFFF;
    }

    /* Canvas phủ toàn màn hình */
    #sketch-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none; /* mặc định không nhận sự kiện */
      z-index: 10;
      cursor: default; /* chuột bình thường */
      touch-action: none;
    }

    #sketch-canvas.active {
      pointer-events: auto; /* nhận sự kiện khi bật vẽ */
      cursor: crosshair; /* chuột dạng chữ thập khi vẽ */
    }

    /* Thông báo trạng thái cực nhỏ, chỉ hiện khi vẽ, mờ, không phải bảng điều khiển */
    #status {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 0.55rem;
      color: rgba(139, 69, 19, 0.25);
      font-family: 'Segoe UI', sans-serif;
      letter-spacing: 0.5px;
      z-index: 20;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #status.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Canvas vẽ -->
  <canvas id="sketch-canvas"></canvas>

  <!-- Trạng thái cực nhỏ, mờ (chỉ để biết đang vẽ hay không) -->
  <div id="status">✏️</div>

  <script>
    (function() {
      "use strict";

      const canvas = document.getElementById('sketch-canvas');
      const statusEl = document.getElementById('status');
      const ctx = canvas.getContext('2d');

      let isDrawing = false;
      let drawMode = false;      // bật/tắt chế độ vẽ
      let lastX = 0, lastY = 0;

      // Màu nét vẽ #8B4513
      const COLOR = '#8B4513';
      const LINE_WIDTH = 2.8;

      // ---- Cập nhật kích thước canvas theo cửa sổ ----
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Phục hồi nét vẽ nếu có
        if (window._savedImageData) {
          ctx.putImageData(window._savedImageData, 0, 0);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      // ---- Lưu ảnh hiện tại ----
      function saveImageData() {
        try {
          window._savedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        } catch(e) {
          // Bỏ qua nếu canvas trống
        }
      }

      // ---- Khởi tạo ----
      function initCanvas() {
        resizeCanvas();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = COLOR;
        ctx.fillStyle = COLOR;
        ctx.lineWidth = LINE_WIDTH;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.classList.remove('active');
        saveImageData();
        statusEl.classList.remove('show');
      }

      // ---- Lấy tọa độ chuột / cảm ứng ----
      function getCoords(e) {
        let clientX, clientY;
        if (e.touches) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
          e.preventDefault();
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        return { x: clientX, y: clientY };
      }

      // ---- Vẽ ----
      function startDrawing(e) {
        if (!drawMode) return;
        isDrawing = true;
        const pos = getCoords(e);
        lastX = pos.x;
        lastY = pos.y;
        // Chấm nhỏ tại điểm bắt đầu
        ctx.beginPath();
        ctx.arc(lastX, lastY, ctx.lineWidth * 0.5, 0, 2 * Math.PI);
        ctx.fillStyle = COLOR;
        ctx.fill();
        statusEl.classList.add('show');
      }

      function draw(e) {
        if (!isDrawing || !drawMode) return;
        e.preventDefault();
        const pos = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDrawing(e) {
        if (isDrawing) {
          isDrawing = false;
          saveImageData();
          statusEl.classList.remove('show');
        }
      }

      // ---- Bật/tắt chế độ vẽ (phím V) ----
      function toggleDraw() {
        drawMode = !drawMode;
        if (drawMode) {
          canvas.classList.add('active');
          statusEl.textContent = '✏️ vẽ';
          statusEl.classList.add('show');
        } else {
          canvas.classList.remove('active');
          if (isDrawing) isDrawing = false;
          statusEl.textContent = '✏️';
          statusEl.classList.remove('show');
        }
      }

      // ---- Xóa toàn bộ (phím X) ----
      function clearSketch() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveImageData();
      }

      // ---- Gán sự kiện ----
      function attachEvents() {
        // Chuột
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Cảm ứng
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

        // Phím nóng
        window.addEventListener('keydown', function(e) {
          const tag = document.activeElement?.tagName?.toLowerCase();
          // Không xử lý nếu đang focus vào input/textarea
          if (tag === 'input' || tag === 'textarea') return;

          const key = e.key.toLowerCase();
          if (key === 'v') {
            e.preventDefault();
            toggleDraw();
          } else if (key === 'x') {
            e.preventDefault();
            clearSketch();
          }
        });

        // Resize cửa sổ
        let resizeTimeout;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(function() {
            saveImageData();
            resizeCanvas();
          }, 100);
        });
      }

      // ---- Khởi chạy ----
      initCanvas();
      attachEvents();

      // Lưu trạng thái ban đầu
      setTimeout(saveImageData, 50);

    })();
  </script>
</body>
</html>
